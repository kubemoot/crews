{{- $engine := .Values.mcpServers.search.engine | default "python" }}
{{- if not (has $engine (list "python" "go")) }}
{{- fail (printf "mcpServers.search.engine must be python or go, got %q" $engine) }}
{{- end }}
{{- $goImage := "" }}
{{- if eq $engine "go" }}
{{- $goImage = include "oguide-crew.image" (dict "root" $ "image" (required "mcpServers.search.go.image is required with engine go" .Values.mcpServers.search.go.image)) }}
{{- if not (or (regexMatch "@sha256:[0-9a-f]{64}$" $goImage) (regexMatch "/oguide-search:0\\.0\\.0$" $goImage)) }}
{{- fail (printf "mcpServers.search.go.image must be pinned by digest (name@sha256:<64 hex>), got %q" $goImage) }}
{{- end }}
{{- end }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: search-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.labels" . | nindent 4 }}
spec:{{ include "oguide-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "search-mcp") }}
  description: "The crew's fixed searches of the O'Reilly catalog (released titles, scheduled titles, by author, by title, live events), with the dates, counts, and order set for the agents."
  {{- if or (not .Values.perPerson.enabled) .Values.perPerson.keepShared }}
  {{- include "oguide-crew.smokeInputs" (dict "root" $ "name" "search") }}
  {{- end }}
  # The crew's search server: five fixed searches of the O'Reilly
  # catalog (find_released, find_scheduled, find_by_author, find_title, find_live_events), each taking one
  # text argument. It builds every date filter, the item count, and the order itself, and
  # labels each item Released or Scheduled from the requester's date. Pure stdio, so the
  # operator adds the bridge sidecar (port is the bridge's TCP port).
  {{- if eq $engine "go" }}
  # engine go: the static Go binary of search-server-go in its own image, pinned by digest (see
  # values.yaml). The bridge runs it in exec mode, so the start command is explicit. No code
  # Secret, no secret volume, and no credential of any kind: it reads five plain variables.
  image: {{ $goImage | quote }}
  transport: stdio
  command:
    - "/workspace/oguide-search"
  port: 3000
  replicas: 1
  {{- else }}
  # engine python: search-server/server.py. The code comes from the Secret above; the image is the
  # official Python image, pinned by digest (see values.yaml).
  image: {{ .Values.mcpServers.search.image | quote }}
  transport: stdio
  command:
    - "python"
    - "/app/server.py"
  port: 3000
  replicas: 1
  secretVolumes:
    - name: {{ .Values.mcpServers.search.codeSecretName }}
      mountPath: /app/server.py
      subPath: server.py
  {{- end }}
  # The server holds no key. It calls the raw O'Reilly search through this crew's gateway
  # (the gateway's tool endpoint, as agents do), where the key, the argument coercion and the
  # call log live. Rotating the key needs no restart here.
  env:
    - name: OREILLY_GATEWAY_URL
      value: {{ printf "http://%s.%s.svc:%v" .Values.mcpGateway.name .Release.Namespace .Values.mcpGateway.port | quote }}
    - name: OREILLY_DEFAULT_TIMEZONE
      value: {{ .Values.oreilly.defaultTimeZone | quote }}
    {{- if include "oguide-crew.expertOn" $ }}
    # Adds ask_experts and get_citation, which wrap the Expert MCP tools behind the gateway.
    - name: OREILLY_EXPERT
      value: "true"
    {{- end }}
    {{- if .Values.perPerson.enabled }}
    # Appends the per-person access sentence to every tool description and passes the asker's
    # conversationId and principalId on to the gateway.
    - name: OREILLY_PER_PERSON
      value: "true"
    - name: OREILLY_ACCESS_NOTE
      value: {{ .Values.perPerson.accessNote | quote }}
    {{- end }}
    {{- if eq $engine "python" }}
    # The checksum of the code, so a chart upgrade that changes server.py changes the spec and
    # the pod restarts (a mounted single file is not refreshed in a running pod).
    - name: SEARCH_SERVER_SHA256
      value: {{ .Files.Get "search-server/server.py" | sha256sum | quote }}
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    - name: PYTHONUNBUFFERED
      value: "1"
    {{- end }}
  {{- if .Values.perPerson.enabled }}
  # The search server calls the gateway for each tool call it serves. relayContext keeps the
  # asking person's conversationId and principalId in the _meta the gateway forwards to this
  # server, so the server can pass them back and the gateway can use that person's own O'Reilly
  # access for the inner call. This server holds no credential of its own (mode Off).
  registry:
    callerCredential:
      mode: Off
      relayContext: true
  {{- end }}
  capabilities:
    - library-search
    - catalog
  securityContext:
    # The server calls the crew's gateway over the cluster network and writes nothing: read-only root
    # filesystem, all capabilities dropped, no privilege escalation. The Python image runs as uid 0;
    # the Go image runs as its run image's user (1002).
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  {{- if eq $engine "go" }}
  resources:
    {{- toYaml .Values.mcpServers.search.go.resources | nindent 4 }}
  {{- else }}
  resources:
    requests:
      cpu: "20m"
      memory: "48Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  {{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: artifact-readops-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.labels" . | nindent 4 }}
spec:
  # Read-ops over spilled discussion artifacts (head, tail, grep, count, rows, select,
  # jq). A search result too large for the discussion bus is stored as an artifact, and
  # the curator reads it through this server, so the whole result never enters a model
  # context. The kubemoot/artifact-access image in mcp mode; pure stdio, so the operator
  # adds the bridge sidecar (port is the bridge's TCP port).
  image: {{ include "oguide-crew.image" (dict "root" $ "image" .Values.mcpServers.artifactAccess.image) | quote }}
  transport: stdio
  # Buildpacks image: the launcher /cnb/process/web starts the binary. The bridge runs
  # exec mode, so the start command must be explicit.
  command:
    - "/cnb/process/web"
  port: 3000
  replicas: 1
  # It reads the artifacts bucket directly from NATS, so it needs NATS egress and no
  # other credentials.
  env:
    - name: ARTIFACT_MODE
      value: "mcp"
    - name: NATS_URL
      value: {{ .Values.nats.url | quote }}
    - name: ARTIFACT_BUCKET
      value: "kubemoot_discussion_artifacts"
  capabilities:
    - data-access
    - data-analysis
  securityContext:
    # The image is FROM scratch and runs as uid 0; read-only root filesystem, all
    # capabilities dropped, and no privilege escalation contain it.
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

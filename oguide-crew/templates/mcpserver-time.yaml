apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: time-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.labels" . | nindent 4 }}
spec:
  # The Model Context Protocol project's reference Time server (modelcontextprotocol/servers,
  # src/time, MIT): get_current_time and convert_time. The library search and events agents read today's date from it.
  # Pure stdio, so the operator adds the bridge sidecar (port is the bridge's TCP port).
  # The image is the Docker-built mcp/time, pinned by digest (see values.yaml).
  image: {{ .Values.mcpServers.time.image | quote }}
  transport: stdio
  command:
    - "mcp-server-time"
    - "--local-timezone"
    - {{ .Values.mcpServers.time.localTimezone | quote }}
  port: 3000
  replicas: 1
  capabilities:
    - time
  securityContext:
    # The server reads the clock and the tz database only, and runs with a read-only root
    # filesystem (checked with docker run --read-only). The image runs as uid 0, so the
    # read-only root, dropped capabilities, and no privilege escalation contain it.
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: "20m"
      memory: "48Mi"
    limits:
      cpu: "100m"
      memory: "128Mi"

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: events-scout
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.agentLabels" (dict "root" $ "role" "tooler") | nindent 4 }}
  annotations:
    kubemoot.ai/discuss-priority: medium
spec:
  type: chat
  description: "Finds upcoming O'Reilly live events and live courses on a topic and reports every session date, and finds books, videos, and courses scheduled for release."
  discussRole: tooler
  capabilities: [tool-calling]
  discussChannels:
    - library
    - general
  triageSummary: "Finds upcoming O'Reilly live events, live training, workshops, and conference sessions on a topic, with every session date and the reader link, and books, videos, and courses announced for release."
  promptRefs: [discussion-protocol, catalog-grounding, response-style, tooler-discipline, events-scout-system]
  enabledTools: [get_current_time, search_oreilly_content]
  discussKeywords:
    - live
    - event
    - events
    - upcoming
    - scheduled
    - forthcoming
    - unreleased
    - workshop
    - training
    - session
    - sessions
    - conference
    - schedule
  temperature: "0.3"
  maxTokens: 4096
  think: false
  deployment:
    replicas: 1
    port: 8080

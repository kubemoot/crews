apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: oreilly-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.labels" . | nindent 4 }}
spec:
  # The O'Reilly MCP server that O'Reilly provides to subscribers: one tool,
  # search_oreilly_content, a catalog keyword search. No deployment is created; the
  # gateway calls the endpoint with the subscriber key from the Secret below. Only the
  # crew's search server (templates/mcpserver-search.yaml) calls this raw tool: the agents'
  # tool lists name the search server's tools and never this one.
  externalEndpoint: {{ required "oreilly.endpoint is required" .Values.oreilly.endpoint | quote }}
  transport: http
  capabilities:
    - library-search
    - catalog
  registry:
    enabled: true
    categories:
      - library
    # The installer's own Secret in this namespace, holding their subscriber key under
    # {{ .Values.oreilly.auth.secretKey }}. The chart names it and never holds a key.
    authSecretRef: {{ include "oguide-crew.authSecretName" . | quote }}
    {{- with .Values.oreilly.auth.header }}
    authHeader: {{ . | quote }}
    {{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Crew
metadata:
  name: {{ .Values.crew.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.labels" . | nindent 4 }}
  annotations:
    kubemoot.ai/manage-namespace: "true"
spec:
  description: {{ .Values.crew.description | quote }}
  discussion:
    enabled: {{ .Values.crew.discussion.enabled }}
{{- with (.Values.network | default dict).allowedIngress }}
  network:
    allowedIngress:
      {{- toYaml . | nindent 6 }}
{{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: oguide-coordinator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oguide-crew.agentLabels" (dict "root" $ "role" "coordinator") | nindent 4 }}
spec:{{ include "oguide-crew.egress" (dict "root" $ "kind" "agents" "name" "oguide-coordinator") }}
  type: chat
  description: "O'guide coordinator: plans the turn, convenes the subcommittee, and writes the answer with a reader link for every item"
  discussRole: coordinator
  capabilities:
    - tool-calling
    - reasoning
  discussChannels:
    - library
    - general
  promptRefs:
    - advisory-prompt
    - catalog-grounding
    - coordinator-decision-logic
    - synthesis-prompt
  temperature: "0.1"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # The coordinator has no MCP tools; it delegates over the discussion bus.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "false"
      # The coordinator facilitates and does not take part as a tooler.
      - name: KUBEMOOT_DISCUSS_TOOLER
        value: "false"
      # Synthesis on the large model over several contributions needs more than the default.
      - name: KUBEMOOT_DISCUSS_SYNTHESIS_TIMEOUT_SECONDS
        value: "180"
      # Tolerate model swaps and accelerator queues.
      - name: QUARKUS_LANGCHAIN4J_OLLAMA_TIMEOUT
        value: "300s"

crew:
  name: oguide
  description: "O'guide: finds, compares, ranks and links O'Reilly library material (books, videos, courses, live events) through the O'Reilly catalog search"
  discussion:
    enabled: true
  # How Kubemoot places this crew's model calls: algorithm, learned (where each call
  # is predicted to finish soonest), or shadow (algorithm places; learned is logged
  # beside it). Empty inherits the cluster default (KubemootConfig).
  placementPolicy: ""

# Namespaces whose pods may reach this crew's discussion gateway when the operator
# generates network policies (Crew spec.network.allowedIngress). Each entry is a
# Kubernetes namespace label selector. Empty: only the crew's own namespace and the
# operator. Needs a Kubemoot operator that supports Crew network policies; leave it
# empty on an operator that does not.
network:
  allowedIngress: []

# Chat models: this chart ships none and names no model server. The cluster owner's
# model catalog supplies them (Model objects in the operator namespace plus the models
# each ModelServer reports), and the crew's CrewSchedulingPolicy
# (templates/crewschedulingpolicy.yaml) says what each phase needs. One chat model with
# tool-calling is enough; with a range of sizes, the coordinator and the curator lean
# to the large model and the search agents to medium.

# The O'Reilly MCP server that O'Reilly provides to its subscribers. It offers one tool, a
# keyword search of the catalog that returns metadata (title, authors, dates, page count or
# duration, a reader link) and no text from inside the content. The crew's gateway calls it
# with the subscriber key; the crew's search server reaches it only through the gateway.
oreilly:
  endpoint: https://api.oreilly.com/api/content-discovery/v1/mcp/
  # The IANA time zone whose date is "today" when a request carries no date or time zone of
  # its own (see the README). The date matters here, not the time of day.
  defaultTimeZone: UTC
  # The subscriber key. This chart never holds a key: the installer creates the Secret
  # with their own O'Reilly key, in the crew namespace or in the operator namespace with
  # the crew namespace's kubemoot.ai/replicate-secrets annotation naming it. The
  # MCPServer names the Secret only, and the gateway sends the key on every call.
  auth:
    secretName: oreilly-mcp-auth
    # The Secret key that holds the subscriber key, one of the two key names the
    # operator reads:
    #   bearer-token  sent as "Authorization: Bearer <key>" (what O'Reilly expects)
    #   api-key       sent in the header named by `header` (the operator's default is X-API-Key)
    secretKey: bearer-token
    # Only with secretKey api-key: the header that carries the key.
    header: ""

# The curator. workspaceQuery adds the workspace_query tool (read-only SQL over the
# discussion's staged artifacts, such as spilled search results) to its tools. The artifact
# read-ops server offers it only when the operator setting artifacts.queryEngine is sqlite
# or duckdb; otherwise the curator does not register it.
curator:
  workspaceQuery: true

# MCP gateway the search agents and the curator call their tools through. It registers
# this release's MCPServers.
mcpGateway:
  name: oguide-gateway
  port: 8080
  replicas: 1
  # The Kubemoot gateway's JVM needs about 608Mi; 768Mi leaves headroom.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Pull secrets for the gateway, for a cluster that mirrors the Kubemoot images in a
# private registry, e.g. [{name: my-registry-pull-secret}].
imagePullSecrets: []

# NATS JetStream that carries the discussion and the artifact store. The Kubemoot
# quickstart and operator chart use release "nats" in namespace "nats".
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"

mcpServers:
  search:
    # The crew's search server runs in the official Python image, pinned by digest (never a
    # tag); its code is search-server/server.py, delivered through a Secret.
    image: "python@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f"
    codeSecretName: oguide-search-server

# An optional extra seat run by goose, an external harness (the Moot Mesh sidecar gives it
# the model and the catalog search). Off by default; turn it off again to remove the seat.
# The image is the one the cluster's KubemootConfig names (images.harnessGoose).
gooseSeat:
  enabled: false
  name: goose-curator

# Outbound network access per workload. Each map is keyed by the rendered name of an
# MCPServer (mcpServers) or an Agent (agents); the value is copied verbatim into that
# resource's spec.egress, so a field the operator adds later needs no chart change.
# Empty renders no spec.egress, which is what a Kubemoot without egress policies needs.
# Example: egress.mcpServers.search-mcp.allowedHosts=[api.example.com], ports=[443].
# Needs a Kubemoot operator with egress policies and security.networkPolicies.egress.mode:
# Declared on the operator chart; see the README.
# agentsDefault, when set (an empty map {} included), becomes spec.egress on every Agent
# that has no entry of its own under agents; a named agents entry replaces it entirely.
# MCP servers never take it. {} limits agents to the operator's automatic allows.
egress:
  # agentsDefault: {}
  mcpServers: {}
  agents: {}

# Dependabot version updates: weekly, one grouped pull request per ecosystem.
# Commit prefixes drive the semantic version bump (chore and ci are patch bumps).
# Every pull request is reviewed by a maintainer before it merges.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    # v2.6.0's image cannot be pulled (its ghcr.io index references deleted manifests,
    # ossf/scorecard-action#1752); take the next release.
    ignore:
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]

  - package-ecosystem: pip
    directories:
      - "/scripts"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directories:
      - "/oguide-crew/search-server-go"
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

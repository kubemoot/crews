# Promote Release: publish tested crew chart release candidates as public releases.
#
# Every push to main builds a release candidate (X.Y.Z-rc.N) of each changed crew
# chart into Harbor, and the homelab runs it. When the candidates have passed their
# tests and measurements, a maintainer runs this workflow (Actions tab, Run workflow;
# dispatch needs write access). For every crew it takes the latest unreleased
# candidate, packages the chart from that candidate's commit with the final version,
# pushes it to Harbor and the release registry, tags the commit <crew>-vX.Y.Z, and
# writes one GitHub Release per crew (.github/scripts/promote-release.sh). A crew that
# pins a Kubemoot release candidate image is refused: promote Kubemoot first.
#
# The default is a dry run: it plans, packages, and shows the release notes in the run
# summary, and publishes nothing. If the release job fails after promote succeeded,
# use "Re-run failed jobs".
name: Promote Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a release-candidate tag on main to promote up to'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: plan and package only, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: promote-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote:
    # Harbor is reachable only in-cluster, so promotion runs on the homelab runners,
    # and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # RELEASE_TOKEN (contents and workflows write) lets the final tag land on the
          # candidate's commit when workflow files changed on main after it; the default
          # token is refused there. Falls back to the default token.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          filter: blob:none

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          # The Harbor push combination the crew releases use: helm v3.14.0 with
          # --insecure-skip-tls-verify.
          version: 'v3.14.0'

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@cee9e2e1fd27c0cc9196578af77dd7b07a585e4f # v0.1.0

      - name: Test the release scripts
        run: |
          bash .github/scripts/test-promote-release.sh

      - name: Log in to Harbor
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Promote
        env:
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ vars.REGISTRY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OUT_DIR: promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/promote-release.sh

      - name: Release notes to the run summary
        run: cat promotion/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the promotion output
        uses: actions/upload-artifact@v7
        with:
          name: promotion
          path: promotion/
          retention-days: 30

  release:
    needs: promote
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the promotion output
        uses: actions/download-artifact@v8
        with:
          name: promotion
          path: promotion

      - name: Create the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # promotion/releases.tsv: tag, title, notes file (one release per line).
          while IFS=$'\t' read -r tag title notes; do
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "${tag} already has a release"
              continue
            fi
            gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title "${title}" --notes-file "promotion/${notes}"
          done < promotion/releases.tsv

name: kubemoot-fitness-crew Release

# Path-filtered per-crew release pipeline. Triggers only when files under
# kubemoot-fitness-crew/ change so each crew's version stream stays independent.
# Modeled on homelab-pilot's release.yaml; one workflow per crew.

on:
  push:
    branches: [main]
    paths:
      - 'kubemoot-fitness-crew/**'
      - '.github/workflows/kubemoot-fitness-crew-release.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: harbor-homelab.dijure.com
  CHART_NAME: kubemoot-fitness-crew
  CHART_PATH: kubemoot-fitness-crew

jobs:
  release:
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate semantic version (per-crew, path-filtered)
        id: version
        uses: paulhatch/semantic-version@v6.0.1
        with:
          tag_prefix: "kubemoot-fitness-crew-v"
          major_pattern: "(BREAKING CHANGE|feat!|fix!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: true
          search_commit_body: true
          # Only count commits whose changes touch this crew's path. Keeps
          # other crews' commits from bumping this crew's version.
          change_path: "kubemoot-fitness-crew"

      - name: Check if release needed
        id: check
        run: |
          echo "Current version: ${{ steps.version.outputs.version }}"
          echo "Changed: ${{ steps.version.outputs.changed }}"

          if [ "${{ steps.version.outputs.changed }}" = "true" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "Will create release kubemoot-fitness-crew-v${{ steps.version.outputs.version }}"
          else
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "Skipping release - no version-bumping commits since last tag for this crew"
          fi

      - name: Install Helm
        if: steps.check.outputs.release_created == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Update Chart.yaml version
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Chart.yaml to version: $VERSION"
          sed -i "s/^version:.*/version: $VERSION/" "${CHART_PATH}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: $VERSION/" "${CHART_PATH}/Chart.yaml"
          grep -E "^(version|appVersion):" "${CHART_PATH}/Chart.yaml"

      - name: Package and push Helm chart
        if: steps.check.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/crews"

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Packaging ${CHART_NAME}..."
          helm package "${CHART_PATH}"

          echo "Pushing ${CHART_NAME} to ${CHART_REGISTRY}..."
          helm push --insecure-skip-tls-verify "${CHART_NAME}-${VERSION}.tgz" "${CHART_REGISTRY}"

          # Harbor is the in-cluster deploy path. When a release registry is configured
          # (repo variable RELEASE_REGISTRY, e.g. ghcr.io/kubemoot), publish the same
          # chart there too so it is reachable outside the cluster.
          if [ -n "${RELEASE_REGISTRY:-}" ]; then
            echo "${GHCR_TOKEN}" | helm registry login "${RELEASE_REGISTRY%%/*}" -u "${GHCR_USERNAME}" --password-stdin
            helm push "${CHART_NAME}-${VERSION}.tgz" "oci://${RELEASE_REGISTRY}/charts"
          fi

      - name: Commit Chart.yaml version bump
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet "${CHART_PATH}/Chart.yaml"; then
            echo "No Chart.yaml changes to commit"
          else
            git add "${CHART_PATH}/Chart.yaml"
            git commit -m "chore(${CHART_NAME}): update chart to v${VERSION} [skip ci]"
          fi

      - name: Create and push tag
        if: steps.check.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${CHART_NAME}-v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, skipping"
          elif git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists on remote, skipping"
          else
            echo "Creating tag: $TAG"
            git tag -a "$TAG" -m "Release $TAG"
          fi

          git push origin main --follow-tags || {
            echo "Push failed, attempting without tags..."
            git push origin main || true
          }

      - name: Create GitHub Release
        if: steps.check.outputs.release_created == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CHART_NAME }}-v${{ steps.version.outputs.version }}
          name: ${{ env.CHART_NAME }}-v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false

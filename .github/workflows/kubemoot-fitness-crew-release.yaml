name: kubemoot-fitness-crew Release

# Path-filtered per-crew release pipeline. Triggers only when files under
# kubemoot-fitness-crew/ change so each crew's version stream stays independent.
# Modeled on homelab-pilot's release.yaml; one workflow per crew.
#
# A Kubemoot Publish Release sends the kubemoot-published event when it succeeds; the
# crew then builds a forced candidate, as force_release does, so the chart takes the new
# Kubemoot finals (stamp-crew.sh) and the crews Publish Release needs nothing by hand.

on:
  push:
    branches: [main]
    paths:
      - 'kubemoot-fitness-crew/**'
      - '.github/workflows/kubemoot-fitness-crew-release.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch:
    types: [kubemoot-published]

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  CHART_NAME: kubemoot-fitness-crew
  CHART_PATH: kubemoot-fitness-crew

jobs:
  release:
    runs-on: homelab-runners
    permissions:
      contents: write # pushes the release candidate tag

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes the tag even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@6ba4d559b8ec0fe5b57b101eb7831ab48289c036 # v0.10.2
        with:
          tag_prefix: "kubemoot-fitness-crew-v"
          change_path: "kubemoot-fitness-crew"
          force: ${{ inputs.force_release || github.event_name == 'repository_dispatch' }}

      - name: Install Helm
        if: steps.version.outputs.release_created == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'

      # Git holds 0.0.0 for the chart version and for every Kubemoot image tag; the build
      # stamps the candidate version and the latest final Kubemoot image tags into the
      # chart it packages and never commits them.
      - name: Stamp the chart version and the Kubemoot images
        if: steps.version.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/stamp-crew.sh "${CHART_PATH}" "${VERSION}"

      - name: Package and push Helm chart
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/crews"

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Packaging ${CHART_NAME}..."
          helm package "${CHART_PATH}"

          echo "Pushing ${CHART_NAME} to ${CHART_REGISTRY}..."
          helm push --insecure-skip-tls-verify "${CHART_NAME}-${VERSION}.tgz" "${CHART_REGISTRY}"

      - name: Create and push tag
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${CHART_NAME}-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The tag marks the commit this run built; nothing is committed back to main.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Release candidate $TAG" "${GITHUB_SHA}"
            git push origin "refs/tags/$TAG"
          fi

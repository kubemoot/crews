# Independent quality pipeline - runs in parallel with the release workflows, never blocks builds.
# Reports to the self-hosted SonarQube for centralized code quality analysis.
# Main only: SonarQube is reachable from the self-hosted cluster runners, and pull
# requests run on GitHub-hosted runners that cannot reach it.
name: Quality

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: homelab-runners
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # full history for SonarQube new-code detection

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Tests with coverage
        run: |
          python -m pip install --quiet --require-hashes -r scripts/requirements-test.txt
          python -m coverage run -m unittest discover -s scripts -p 'test_*.py'
          python -m coverage xml -o coverage.xml
          python -m coverage report
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

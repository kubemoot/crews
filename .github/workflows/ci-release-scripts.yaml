# Tests for the release and promotion scripts and the fitness suite builder. Not a release gate.
name: CI Release Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/ci-release-scripts.yaml'
      - 'scripts/**'
  push:
    branches-ignore: [main]
    paths:
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/ci-release-scripts.yaml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - name: Shellcheck
        run: shellcheck -x .github/scripts/*.sh
      - name: Tests
        run: |
          bash .github/scripts/test-release-lib.sh
          bash .github/scripts/test-promote-release.sh
      - name: Fitness suite builder tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

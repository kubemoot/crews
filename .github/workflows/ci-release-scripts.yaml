# Tests for the release scripts, the fitness suite builder, and the brand copies; lints the Python. Not a release gate.
name: CI Release Scripts

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-release-scripts.yaml'
      - '.github/workflows/*-release.yaml'
      - '*/Chart.yaml'
      - '*/values.yaml'
      - 'scripts/**'
      - 'ruff.toml'
      - 'brand.lock'
      - '.github/assets/**'
  push:
    branches-ignore: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ci-release-scripts.yaml'
      - '.github/workflows/*-release.yaml'
      - '*/Chart.yaml'
      - '*/values.yaml'
      - 'scripts/**'
      - 'ruff.toml'
      - 'brand.lock'
      - '.github/assets/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The README lockups are copies of github.com/kubemoot/.github brand/ files;
      # brand.lock pins the commit and each copy's sha256.
      - name: Check the brand copies against brand.lock
        run: scripts/brand-sync.sh check && scripts/brand-sync.test.sh
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.14.0'
      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@916e0bb62dadab8a4ee770ffb2a74e8ae414e40a # agent/shared-signing
      - name: Shellcheck
        run: shellcheck -x .github/scripts/*.sh
      - name: Tests
        run: |
          bash .github/scripts/test-publish-release.sh
          bash .github/scripts/test-stamp-crew.sh
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Ruff with the root ruff.toml, pinned by scripts/requirements-lint.txt.
      - name: Lint Python
        run: |
          python -m pip install --quiet --require-hashes -r scripts/requirements-lint.txt
          ruff check .
      - name: Fitness suite builder tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

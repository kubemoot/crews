# Publish Release: publish tested crew chart release candidates as public releases.
#
# Every push to main builds a release candidate (X.Y.Z-rc.N) of each changed crew
# chart into Harbor, and the homelab runs it. When the candidates have passed their
# tests and measurements, a maintainer runs this workflow (Actions tab, Run workflow;
# dispatch needs write access). For every crew it takes the latest unreleased
# candidate, packages the chart from that candidate's commit with the final version and
# the Kubemoot image tags the candidate ran, pushes it to Harbor (the homelab moves to
# the final) and the release registry, tags the commit <crew>-vX.Y.Z, and
# writes one GitHub Release per crew (.github/scripts/publish-release.sh). A candidate
# pin of a Kubemoot release candidate image maps to its final when Kubemoot's final tag
# exists and its image digest equals the candidate's; otherwise the crew is refused:
# publish Kubemoot first, or rebuild the crew candidate.
#
# Each chart pushed to the release registry is signed there by digest with cosign,
# keyless (no stored key), and the attest job records SLSA build provenance for it in
# the registry and the repository's attestations. The certificates name this workflow:
#   cosign verify ghcr.io/kubemoot/charts/<crew>:<version> \
#     --certificate-identity https://github.com/kubemoot/crews/.github/workflows/publish-release.yaml@refs/heads/main \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/kubemoot/charts/<crew>:<version> --repo kubemoot/crews
# Each crew's GitHub Release carries its chart's provenance as <crew>_<version>.intoto.jsonl:
# the release is created as a draft, given the file, and then published, since releases
# are immutable once published (.github/scripts/create-github-releases.sh).
# A signing failure stops the publish job before any tag, so no GitHub Release is written.
#
# The default is a dry run: it plans, packages, and shows the release notes in the run
# summary, and publishes and signs nothing; it checks that cosign runs and that the job
# can mint the OIDC token the signatures need. If the attest or release job fails after
# the publish job succeeded, use "Re-run failed jobs".
name: Publish Release

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: '"latest", or a release-candidate tag on main to publish up to'
        required: true
        default: latest
        type: string
      dry_run:
        description: 'Dry run: plan and package only, publish nothing'
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    # Harbor is reachable only in-cluster, so publishing runs on the homelab runners,
    # and only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: homelab-runners
    permissions:
      contents: write
      packages: write # push the charts to GHCR with the workflow's own token
      id-token: write # cosign keyless signing of the published charts
    outputs:
      subjects: ${{ steps.publish.outputs.subjects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credential is stored; the release token is minted at the step that pushes.
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # The Harbor push combination the crew releases use: helm v3.14.0 with
          # --insecure-skip-tls-verify.
          version: 'v3.14.0'

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Set up the release helpers
        uses: kubemoot/release-actions/setup@2e4abc96ac64b259051eb467f4794d7408b7b9d2 # v0.12.6

      - name: Test the release scripts
        run: |
          bash .github/scripts/test-publish-release.sh
          bash .github/scripts/test-stamp-crew.sh

      - name: Log in to Harbor
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin
          # crane compares a candidate image's digest with its final's; in-cluster only.
          echo "${HARBOR_PASSWORD}" | crane auth login "${REGISTRY}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Mint a release token
        id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: crews
          permission-contents: write
          permission-workflows: write

      - name: Publish
        id: publish
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          # The tag identity, as env, so no git command runs before the script moves the token.
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
          RC_TAG: ${{ inputs.rc_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGISTRY: ${{ vars.REGISTRY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: release-files
        # publish-release.sh takes GH_APP_TOKEN out of the environment before helm, crane or
        # cosign run and uses it only for git push (push-token.sh).
        run: bash .github/scripts/publish-release.sh

      - name: Release notes to the run summary
        run: cat release-files/*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release-files/
          retention-days: 30

  # One job per signed chart: actions/attest pushes provenance to the registry only for
  # a single subject. GitHub-hosted, since it needs GHCR and not Harbor.
  attest:
    needs: publish
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      packages: write # attach the attestation to the package in GHCR
      id-token: write # sign the provenance attestation keylessly
      attestations: write # store the attestation in the repository
    strategy:
      fail-fast: false
      matrix:
        subject: ${{ fromJSON(needs.publish.outputs.subjects) }}
    steps:
      - name: Log in to the release registry
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login "${RELEASE_REGISTRY%%/*}" -u "${GHCR_USERNAME}" --password-stdin

      - name: Attest the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.subject.name }}
          subject-digest: ${{ matrix.subject.digest }}
          push-to-registry: true
          create-storage-record: false

      # The release job attaches this bundle to the GitHub Release; the file is named for
      # the digest, which provenance.tsv maps to the release.
      - name: Name the provenance for the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DIGEST: ${{ matrix.subject.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/provenance"
          cp "${BUNDLE}" "${RUNNER_TEMP}/provenance/${DIGEST//:/-}.jsonl"

      - name: Keep the provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance-${{ strategy.job-index }}
          path: ${{ runner.temp }}/provenance/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  release:
    needs: [publish, attest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Download the provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: provenance-*
          merge-multiple: true
          path: provenance

      - name: Create the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/create-github-releases.sh release-files provenance

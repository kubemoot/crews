name: homelab-pilot-crew Release

# Path-filtered per-crew release pipeline. Triggers only when files under
# homelab-pilot-crew/ change so each crew's version stream stays independent.
# Modeled on homelab-pilot's release.yaml; one workflow per crew.

on:
  push:
    branches: [main]
    paths:
      - 'homelab-pilot-crew/**'
      - '.github/workflows/homelab-pilot-crew-release.yaml'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force a release even if no conventional commits found'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ${{ vars.REGISTRY }}
  CHART_NAME: homelab-pilot-crew
  CHART_PATH: homelab-pilot-crew

jobs:
  release:
    runs-on: homelab-runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # RELEASE_TOKEN (contents+workflows write) pushes even when main's workflow files changed after this commit; GITHUB_TOKEN is refused there.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate the release candidate version
        id: version
        uses: kubemoot/release-actions/release-candidate-version@cee9e2e1fd27c0cc9196578af77dd7b07a585e4f # v0.1.0
        with:
          tag_prefix: "homelab-pilot-crew-v"
          change_path: "homelab-pilot-crew"
          force: ${{ inputs.force_release }}

      - name: Install Helm
        if: steps.version.outputs.release_created == 'true'
        uses: azure/setup-helm@v5
        with:
          version: 'v3.14.0'

      - name: Update Chart.yaml version
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Chart.yaml to version: $VERSION"
          sed -i "s/^version:.*/version: $VERSION/" "${CHART_PATH}/Chart.yaml"
          sed -i "s/^appVersion:.*/appVersion: $VERSION/" "${CHART_PATH}/Chart.yaml"
          grep -E "^(version|appVersion):" "${CHART_PATH}/Chart.yaml"

      - name: Package and push Helm chart
        if: steps.version.outputs.release_created == 'true'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REGISTRY="oci://${{ env.REGISTRY }}/crews"

          echo "Logging in to Harbor OCI registry..."
          echo "${HARBOR_PASSWORD}" | helm registry login --insecure ${{ env.REGISTRY }} -u "${HARBOR_USERNAME}" --password-stdin

          echo "Packaging ${CHART_NAME}..."
          helm package "${CHART_PATH}"

          echo "Pushing ${CHART_NAME} to ${CHART_REGISTRY}..."
          helm push --insecure-skip-tls-verify "${CHART_NAME}-${VERSION}.tgz" "${CHART_REGISTRY}"

      - name: Commit the chart version to main and tag it
        # Re-applies only this release's Chart.yaml version onto fresh main and retries a
        # rejected push (the crews release together and race), then tags only after the
        # commit is on main, so the next version is computed from a tag main contains.
        # Fails loudly instead of leaving a tag off main.
        if: steps.version.outputs.release_created == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${CHART_NAME}-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pushed=false
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            sed -i "s/^version:.*/version: $VERSION/" "${CHART_PATH}/Chart.yaml"
            sed -i "s/^appVersion:.*/appVersion: $VERSION/" "${CHART_PATH}/Chart.yaml"
            if ! git diff --quiet -- "${CHART_PATH}/Chart.yaml"; then
              git add "${CHART_PATH}/Chart.yaml"
              git commit -q -m "chore(${CHART_NAME}): update chart to v${VERSION} [skip ci]"
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "git push rejected (attempt ${attempt}/8); re-reading origin/main and retrying"
            sleep $((attempt * 5))
          done
          [ "$pushed" = true ] || { echo "::error::could not land ${CHART_NAME} ${VERSION} on main"; exit 1; }

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Release candidate $TAG"
            git push origin "refs/tags/$TAG"
          fi


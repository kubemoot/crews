name: Feature request
description: A change to an existing crew.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: "This repository covers the crew charts. A crew that does not exist yet goes in the Suggest a new crew form; ideas for the operator, dashboard, or kmctl belong in [another repository, found through the issue chooser](https://github.com/kubemoot/crews/issues/new/choose)."
  - type: checkboxes
    id: searched
    attributes:
      label: Before you file
      options:
        - label: I searched existing issues and discussions and did not find this one
          required: true
  - type: dropdown
    id: chart
    attributes:
      label: Crew chart
      options:
        - homelab-pilot-crew
        - homelab-pilot-crew-prose
        - kubemoot-fitness-crew
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the situation and the questions you would ask the crew.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to see
      description: A rough shape is fine.
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: "Would you be open to contributing this?"
      options:
        - "Yes"
        - Maybe
        - "No"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: Alternatives you tried, or other context.
    validations:
      required: false

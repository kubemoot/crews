apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-helm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-helm") }}
  type: chat
  description: "Manages Helm releases: list, status, values."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Lists, installs, and uninstalls Helm chart releases."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-helm-system]
  # The Kubernetes MCP server always loads its helm toolset. helm_list reads release
  # state from Secrets, so it answers only with kubernetesAccess.secretRead and fails as
  # forbidden without it; install and uninstall register only with writeAccess.
  enabledTools: [helm_list{{ if .Values.kubernetesAccess.writeAccess }}, helm_install, helm_uninstall{{ end }}]
  discussKeywords:
    - helm
    - chart
    - charts
    - release
    - releases
    - install
    - upgrade
    - uninstall
    - values
    - repository
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-helm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Manages Helm releases: list, status, values."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Lists, installs, and uninstalls Helm chart releases."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-helm-system]
  # helm_* tools exist only with the helm toolset (kubernetesAccess.secretRead);
  # install and uninstall also need writeAccess. An empty list would enable every
  # tool, so without the helm toolset the agent keeps the read-only resource tools.
  enabledTools: [{{ if .Values.kubernetesAccess.secretRead }}helm_list{{ if .Values.kubernetesAccess.writeAccess }}, helm_install, helm_uninstall{{ end }}{{ else }}resources_list, resources_get{{ end }}]
  discussKeywords:
    - helm
    - chart
    - charts
    - release
    - releases
    - install
    - upgrade
    - uninstall
    - values
    - repository
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

{{- if include "homelab-pilot-crew.rbacTenant" . }}
{{- if and .Values.mcpServers.workspace.enabled (dig "artifactReadOps" "enabled" true .Values.mcpServers) }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: workspace-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "workspace-mcp") }}
  description: "Reads slices of large results kept outside the discussion (head, tail, grep, and query), so a whole result never enters a model's context."
  # Shared workspace read service. Network-capable agents (analyst, RAG,
  # coordinator) call head/tail/grep/query over a referenced workspace
  # KEY to sip a slice near the data, so a bulk object never enters an LLM context -
  # the non-code counterpart to the no-network sandbox's materializer. Same binary as
  # the sandbox sidecar (kubemoot/workspace-access), run in mcp mode. Pure stdio ->
  # operator adds the bridge sidecar (port below is the bridge's TCP port).
  # kubemootImage selects the workspace-access image the operator's KubemootConfig names
  # (spec.images.workspaceAccess), so the operator also wires the workspace query engine
  # (WORKSPACE_QUERY_ENGINE, the /kubemoot/workspace emptyDir and TMPDIR). It is exclusive with image.
  kubemootImage: workspaceAccess
  transport: stdio
  # Buildpacks image: the launcher /cnb/process/web starts the binary. The bridge runs
  # exec mode, so the start command must be explicit.
  command:
    - "/cnb/process/web"
  port: 3000
  replicas: 1
  # Unlike the sandbox, this server IS network-capable: it reads the workspace bucket
  # directly from NATS, so it needs NATS egress (and no other credentials).
  env:
    - name: WORKSPACE_MODE
      value: "mcp"
    - name: NATS_URL
      value: {{ .Values.nats.url | quote }}
    - name: WORKSPACE_BUCKET
      value: "kubemoot_workspace"
    - name: WORKSPACE_QUERY_MEMORY
      value: {{ dig "artifactReadOps" "queryMemory" .Values.mcpServers.workspace.queryMemory .Values.mcpServers | quote }}
{{- if .Values.mcpServers.workspace.nestedColumnHints }}
    # A query that guesses a path inside a column holding a nested object gets the column and the
    # SQL that reads the field in its error.
    - name: KUBEMOOT_QUERY_NESTED_HINTS
      value: "true"
{{- end }}
  capabilities:
    - data-access
    - data-analysis
  securityContext:
    # FROM scratch (uid 0); our trusted binary, still contained by read-only rootfs +
    # drop-ALL caps + no-privilege-escalation. Non-root image is a hardening follow-up.
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    {{- toYaml (dig "artifactReadOps" "resources" .Values.mcpServers.workspace.resources .Values.mcpServers) | nindent 4 }}
{{- end }}
{{- end }}

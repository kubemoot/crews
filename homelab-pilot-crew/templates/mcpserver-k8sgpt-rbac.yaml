{{- if .Values.mcpServers.k8sgpt.enabled }}
{{/* k8sgpt runs as its own ServiceAccount, not the Kubernetes MCP servers' one, so what it
can read is the list below and a change to the Kubernetes MCP servers' access does not widen
it. The rules are the objects the analyzers inspect (Pod, Deployment, ReplicaSet, StatefulSet,
Service, Ingress, PVC, Node, CronJob, HPA, PDB, NetworkPolicy, webhook configurations, Gateway
API) and the pod logs and Events they quote. Everything is read-only. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-k8sgpt-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-k8sgpt-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes", "namespaces", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.kubernetesAccess.secretRead }}
  # The Ingress analyzer checks that a TLS Secret exists; this is get on any Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-k8sgpt-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-k8sgpt-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-k8sgpt-mcp
  apiGroup: rbac.authorization.k8s.io
{{- end }}

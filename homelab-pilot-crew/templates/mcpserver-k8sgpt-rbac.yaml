{{- if .Values.mcpServers.k8sgpt.enabled }}
{{/* k8sgpt runs as its own ServiceAccount, not the Kubernetes MCP servers' one, so a change to
their access does not widen it. Its namespaced reads come from the Kubemoot operator's read role,
bound in each namespace that carries kubemoot.ai/crew-read=true (the MCPServer has the
kubernetes capability), and the operator lets it list namespaces. What stays here are the
cluster-scoped kinds its analyzers read, which a RoleBinding cannot grant, all read-only: Nodes
(Node analyzer), PersistentVolumes and StorageClasses (Storage analyzer), IngressClasses
(Ingress analyzer), the two webhook configuration kinds (MutatingWebhook and ValidatingWebhook
analyzers), and GatewayClasses (GatewayClass analyzer). The OLM analyzers are not enabled. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-k8sgpt-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-k8sgpt-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-k8sgpt-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-k8sgpt-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-k8sgpt-mcp
  apiGroup: rbac.authorization.k8s.io
{{- end }}

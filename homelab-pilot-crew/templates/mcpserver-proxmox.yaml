{{- if .Values.mcpServers.proxmox.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: proxmox-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "proxmox-mcp") }}
  image: {{ include "homelab-pilot-crew.image" (dict "root" $ "image" (required "mcpServers.proxmox.image is required when mcpServers.proxmox.enabled is true: no public Proxmox MCP image ships with this chart, so supply your own" .Values.mcpServers.proxmox.image)) | quote }}
  transport: stdio
  command:
    - "proxmox-mcp"
  port: 3000
  replicas: 1
  secretRef: {{ .Values.mcpServers.proxmox.secretRef }}
  capabilities:
    - proxmox
    - hypervisor
    - virtual-machines
    - lxc-containers
    - storage
    - backup
  # The server's own proxmox-node-metrics text names no allowed values; Proxmox's RRD API
  # rejects anything outside them with 400 "Parameter verification failed".
  toolOverrides:
    - name: proxmox-node-metrics
      description: "Performance history of one Proxmox node (CPU, memory, load, network, disk) from its RRD data, as a list of samples."
      parameters:
        node:
          description: "The Proxmox node name, exactly as proxmox-list-nodes returns it."
        timeframe:
          description: "One of: hour, day, week, month, year. The default is hour."
        cf:
          description: "One of: AVERAGE, MAX (uppercase). The default is AVERAGE."
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
{{- end }}

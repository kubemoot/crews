{{- if .Values.mcpServers.proxmox.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: proxmox-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "proxmox-mcp") }}
  image: {{ include "homelab-pilot-crew.image" (dict "root" $ "image" (required "mcpServers.proxmox.image is required when mcpServers.proxmox.enabled is true: the chart ships no Proxmox MCP image; the recommended one is ghcr.io/akmalovaa/proxmox-mcp (see values.yaml)" .Values.mcpServers.proxmox.image)) | quote }}
  # akmalovaa/proxmox-mcp serves Streamable HTTP itself, so the operator adds no bridge
  # sidecar. /healthz only says the process is up; /readyz asks Proxmox for its version and
  # gates traffic until the API answers.
  transport: http
  healthPath: /healthz
  readinessPath: /readyz
  port: 8000
  replicas: 1
  # The Proxmox API credentials come from the Secret as environment variables named for
  # the server: PROXMOX_HOST, PROXMOX_USER, PROXMOX_TOKEN_NAME and PROXMOX_TOKEN_VALUE
  # (see the README for the Secret).
  secretRef: {{ .Values.mcpServers.proxmox.secretRef }}
  env:
    # Registers read tools only: nothing that starts, stops, clones, migrates or
    # snapshots is offered to the model.
    - name: PROXMOX_RISK_LEVEL
      value: "read"
    # Narrows the read tools to the ones the proxmox-pve and proxmox-qm agents use.
    - name: PROXMOX_TOOLS_ALLOW
      value: "list_nodes,get_node_status,get_node_rrd_data,get_node_networks,get_node_tasks,get_task_status,list_storage,get_storage_content,get_cluster_resources,list_vms,get_vm_config,get_vm_rrd_data,list_vm_snapshots"
    - name: PROXMOX_VERIFY_SSL
      value: {{ .Values.mcpServers.proxmox.verifySsl | quote }}
    - name: PROXMOX_MCP_TRANSPORT
      value: "streamable-http"
    - name: PROXMOX_MCP_HOST
      value: "0.0.0.0"
    - name: PROXMOX_MCP_PORT
      value: "8000"
    # The server refuses to bind beyond loopback without the Host headers it should accept:
    # the names the operator's Service answers to.
    - name: PROXMOX_MCP_ALLOWED_HOSTS
      value: "proxmox-mcp:*,proxmox-mcp.{{ .Release.Namespace }}:*,proxmox-mcp.{{ .Release.Namespace }}.svc:*,proxmox-mcp.{{ .Release.Namespace }}.svc.cluster.local:*"
  capabilities:
    - proxmox
    - hypervisor
    - virtual-machines
    - lxc-containers
    - storage
    - backup
  # The descriptions agents see, in ADL. The list tools return a compact row per object
  # unless verbose is true, which adds mostly per-second IO counters. The RRD tools take
  # only node (and vmid), timeframe and cf, the arguments Proxmox's RRD API has, and
  # return every sample of the window; the API rejects any other timeframe or cf with
  # 400 "Parameter verification failed".
  {{- $compact := "ASSERT false (the default) returns the compact row: identity, status, uptime, cpu and memory.\nNEVER pass verbose=true unless the question asks for disk or network IO counters: the full rows are several times larger and are mostly per-second IO counters." }}
  {{- $timeframe := "ASSERT exactly one of: hour, day, week, month, year (the default is day).\nNEVER pass another form such as 1h, 1hour, 24h or 7d: it is rejected." }}
  {{- $cf := "ASSERT exactly AVERAGE or MAX, uppercase (the default is AVERAGE).\nWHEN the question is about typical load THEN pass AVERAGE\nWHEN the question is about spikes or peaks THEN pass MAX" }}
  {{- $rrdArgs := "ASSERT the only arguments are the ones listed here: there is no limit, field or step argument, and every sample of the window comes back with every field" }}
  toolOverrides:
    - name: list_nodes
      parameters:
        verbose:
          description: {{ $compact | toJson }}
    - name: list_vms
      description: |-
        DESCRIPTION Lists the QEMU VMs of the cluster, or of one node, one row per VM
        WHEN the question asks for the status, CPU or memory of several VMs right now THEN read them from this one call, not one history call per VM
        WHEN the question names a node THEN pass node
      parameters:
        verbose:
          description: {{ $compact | toJson }}
    - name: get_cluster_resources
      description: |-
        DESCRIPTION Lists the cluster's resources (VMs and containers, storage, nodes, sdn) in one call, one row per resource
        WHEN the question covers every VM or container in the cluster, including their current CPU and memory THEN call this once with type=vm instead of one call per VM
        WHEN the question is about one kind of resource THEN pass type
      parameters:
        verbose:
          description: {{ $compact | toJson }}
    - name: get_node_rrd_data
      description: |-
        DESCRIPTION Performance history of one Proxmox node (CPU, memory, load, network, disk) from its RRD data, as a list of samples
        {{ $rrdArgs }}
        WHEN the question asks for a value right now THEN use the node status tool instead
        WHEN the question asks for a trend THEN pick the shortest timeframe that covers it
      parameters:
        node:
          description: "ASSERT the Proxmox node name, exactly as list_nodes returns it."
        timeframe:
          description: {{ $timeframe | toJson }}
        cf:
          description: {{ $cf | toJson }}
    - name: get_vm_rrd_data
      description: |-
        DESCRIPTION Performance history of one VM (CPU, memory, disk and network) from its RRD data, as a list of samples
        {{ $rrdArgs }}
        WHEN the question asks for the current CPU or memory of a VM THEN read it from list_vms instead
        WHEN the question asks for a trend THEN pick the shortest timeframe that covers it, and call once per VM the question names
      parameters:
        timeframe:
          description: {{ $timeframe | toJson }}
        cf:
          description: {{ $cf | toJson }}
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
{{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-config") }}
  type: chat
  description: "Fetches live configuration objects from the Kubernetes API: Namespaces, ConfigMaps, Secret names and counts (never their values), ServiceAccounts, Roles, ClusterRoles, RoleBindings, and ClusterRoleBindings."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers what namespaces exist and what configuration and access they hold: ConfigMaps and Secrets per namespace (names and counts only), ServiceAccounts, and the RBAC roles and bindings that grant permissions."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-config-system]
  enabledTools: [resources_list, resources_get, events_list]
  discussKeywords:
    - configmap
    - configmaps
    - secret
    - secrets
    - namespace
    - namespaces
    - serviceaccount
    - serviceaccounts
    - rbac
    - role
    - roles
    - clusterrole
    - rolebinding
    - clusterrolebinding
    - label
    - labels
    - annotation
    - annotations
    - permission
    - permissions
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

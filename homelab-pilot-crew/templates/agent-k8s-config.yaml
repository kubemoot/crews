{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-config") }}
  type: chat
  description: "Fetches live configuration objects from the Kubernetes API: Namespaces, ConfigMaps (their names and their contents, the data keys and values), Secret names and counts (never their values), ServiceAccounts, Roles, ClusterRoles, RoleBindings, and ClusterRoleBindings."
  discussRole: tooler{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "write") }}
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers what namespaces exist and what configuration and access they hold. Reads the contents (the data keys and values) of ConfigMaps and other configuration objects, so a question about what a ConfigMap says, such as a setting, a schedule or a freeze window, is answered here. Lists Secrets per namespace (names and counts only, never their values), ServiceAccounts, and the RBAC roles and bindings that grant permissions."
  promptRefs: [discussion-protocol, {{ include "homelab-pilot-crew.peerVerificationRef" . }}ratify-prompt, response-style, tooler-discipline, k8s-config-system]
  enabledTools: [resources_list, resources_get, events_list]
  domains:
    - kubernetes
    - k8s
  discussKeywords:
    - configmap
    - configmaps
    - secret
    - secrets
    - namespace
    - namespaces
    - serviceaccount
    - serviceaccounts
    - rbac
    - role
    - roles
    - clusterrole
    - rolebinding
    - clusterrolebinding
    - label
    - labels
    - annotation
    - annotations
    - permission
    - permissions
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
{{- end }}

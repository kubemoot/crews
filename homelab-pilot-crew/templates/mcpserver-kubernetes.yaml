{{- if .Values.mcpServers.kubernetes.enabled }}
{{- $podFields := "metadata.name, metadata.namespace, spec.nodeName, spec.restartPolicy, spec.schedulerName, spec.serviceAccountName, status.phase, status.podIP, status.nominatedNodeName" }}
{{- $labelSyntax := "kubectl -l syntax: key=value, key!=value, key in (a,b), key, !key; a comma means AND." }}
{{- $cantSelectStates := "ASSERT container states such as CrashLoopBackOff cannot be selected; read STATUS and RESTARTS in the table." }}
{{- $noWildcard := "NEVER pass all or * as a namespace: they are not wildcards, match no namespace, and return an empty result." }}
{{- $countHow := "pass limit=1 with no labelSelector and no fieldSelector" }}
{{- $countHeader := "# remainingItemCount: N in the header lines of the reply, so the total is N+1" }}
{{- $countRule := printf "WHEN the question asks only how many THEN %s (namespace is fine) and read %s; a reply with no such line holds every match." $countHow $countHeader }}
{{- $limitParam := printf "ASSERT the most rows to return; omit it or pass 0 for every row.\nWHEN counting THEN %s and read %s.\nASSERT a list with a labelSelector or fieldSelector reports no remainingItemCount, so count a selected list from its rows." $countHow $countHeader }}
{{- /* The server takes its settings from a TOML file only (no runtime flags). Without
     port it speaks MCP over stdio, which the operator's bridge sidecar carries. */}}
{{- $config := printf "toolsets = [\"core\", \"helm\"]\nread_only = %t\n" (not (include "homelab-pilot-crew.writeOn" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
type: Opaque
stringData:
  # core: pods, resources, events, nodes and namespaces. helm: helm_list, plus
  # helm_install and helm_uninstall when read_only is false (kubernetesAccess.write.namespaces).
  # read_only registers only the tools that do not change the cluster.
  config.toml: |
    {{- $config | nindent 4 }}
---
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" (printf "%s-kubernetes-mcp" .Release.Name)) }}
  image: {{ .Values.mcpServers.kubernetes.image }}
  transport: stdio
  port: 8080
  replicas: 1
  serviceAccountName: {{ .Release.Name }}-kubernetes-mcp
  securityMode: relaxed
  # --config replaces the image's default config file, which sets an HTTP port; this
  # file sets none, so the server speaks stdio.
  command:
    - "/app/kubernetes-mcp-server"
    - "--config"
    - "/etc/kubernetes-mcp/config.toml"
  # MCPServer mounts Secrets only, so the config file comes from one.
  secretVolumes:
    - name: {{ .Release.Name }}-kubernetes-mcp-config
      mountPath: /etc/kubernetes-mcp
  env:
    # The server reads its config file at start, so a changed config rolls the pod.
    - name: CONFIG_SHA256
      value: {{ $config | sha256sum | quote }}
  capabilities:
    - kubernetes
    - pods
    - helm
    - resources
    - events
    - nodes
  # The server prints every list as a wide table with a LABELS column and has no option
  # for fewer columns, so the size of a list is set by the rows a call asks for: the
  # namespace, the selectors, and limit (a page of rows; limit=1 with no selector also
  # reports how many rows remain, which answers a count). These descriptions, in ADL, say
  # which of those the server and the Kubernetes API accept, so agents narrow a list on
  # the server and do not retry selectors the API rejects. Each restates what the
  # parameter does in the server's source at the version the image pins.
  toolOverrides:
    - name: pods_list
      description: |-
        DESCRIPTION Lists pods in every namespace as a table, one wide row per pod (READY, STATUS, RESTARTS, NODE, LABELS); with no selector the result grows with the number of pods in the cluster
        WHEN the question names a namespace THEN use the list tool that takes a namespace
        {{ $countRule }}
        WHEN the question names a node, a phase or a label THEN narrow the rows on the server with fieldSelector or labelSelector
        {{ $noWildcard }}
        ASSERT an empty result means no pod matched
      parameters:
        fieldSelector:
          description: |-
            ASSERT a server-side filter on pod fields. Accepted fields: {{ $podFields }}; any other field is an error.
            WHEN the question is about one node's pods THEN pass spec.nodeName=<node>
            ASSERT status.phase=Running matches nearly every pod, so it does not narrow; status.phase!=Running,status.phase!=Succeeded finds pods outside those phases.
            {{ $cantSelectStates }}
        labelSelector:
          description: "ASSERT a server-side filter on pod labels, {{ $labelSyntax }} It matches labels only, never fields such as status.phase."
        limit:
          description: {{ $limitParam | toJson }}
    - name: pods_list_in_namespace
      description: |-
        DESCRIPTION Lists the pods of one namespace as a table, one wide row per pod (READY, STATUS, RESTARTS, NODE, LABELS)
        ASSERT namespace is the exact name of one existing namespace
        {{ $noWildcard }}
        {{ $countRule }}
        ASSERT an empty result means no pod matched
      parameters:
        namespace:
          description: "ASSERT the exact namespace name.\n{{ $noWildcard }}"
        fieldSelector:
          description: "ASSERT a server-side filter on pod fields. Accepted fields: {{ $podFields }}; any other field is an error.\n{{ $cantSelectStates }}"
        labelSelector:
          description: "ASSERT a server-side filter on pod labels, {{ $labelSyntax }}"
        limit:
          description: {{ $limitParam | toJson }}
    - name: resources_list
      description: |-
        DESCRIPTION Lists objects of one apiVersion and kind as a table, one wide row per object with a LABELS column; with no namespace it lists every namespace (or only the server's own namespace when its account cannot list cluster-wide), so a cluster-wide list of a common kind such as Deployment, ConfigMap, NetworkPolicy, Node or Pod is large
        {{ $countRule }}
        WHEN the question names a namespace THEN pass namespace
        WHEN the question names labels or a selectable field THEN pass labelSelector or fieldSelector
        {{ $noWildcard }} Omit namespace to list every namespace.
        ASSERT a kind or apiVersion the cluster does not serve is an error, and an empty result means no object matched
      parameters:
        namespace:
          description: "ASSERT the exact namespace name, for a namespaced kind; cluster-scoped kinds such as Node and Namespace ignore it.\nWHEN the question covers every namespace THEN omit namespace or pass an empty string\n{{ $noWildcard }}"
        labelSelector:
          description: "ASSERT a server-side filter on object labels, {{ $labelSyntax }} It matches labels only, so node-role.kubernetes.io/control-plane selects control-plane Nodes."
        fieldSelector:
          description: "ASSERT a server-side filter on fields; the API server accepts only a few per kind and rejects any other field with an error. Node: metadata.name, spec.unschedulable. Namespace: metadata.name, status.phase. Pod: {{ $podFields }}. Job: metadata.name, metadata.namespace, status.successful. Most other kinds, including Deployment, DaemonSet, CronJob and ConfigMap: metadata.name and metadata.namespace.\nASSERT conditions, a Node's Ready state and a Deployment's replica counts cannot be selected; read STATUS and READY in the table."
        limit:
          description: {{ $limitParam | toJson }}
    - name: pods_top
      description: |-
        DESCRIPTION CPU and memory from the Metrics Server, one row per container, not per pod
        ASSERT all_namespaces defaults to true, so a call with no namespace and no name returns every container in the cluster
        WHEN the question names a namespace THEN pass namespace
        WHEN the question names one pod THEN pass name and namespace (name alone fails)
        WHEN the question names a label THEN pass label_selector
        ASSERT the Metrics API ignores limit and continue; only namespace, name and label_selector make the result smaller
      parameters:
        all_namespaces:
          description: "ASSERT defaults to true: with no namespace, every container of every pod in the cluster is returned.\nWHEN the question names a namespace THEN pass namespace instead, which limits the result to that namespace"
        label_selector:
          description: "ASSERT a server-side filter on pod labels, {{ $labelSyntax }} Used only when name is not given."
    - name: events_list
      description: |-
        DESCRIPTION Lists events as YAML, one entry per event with the involved object, reason and message, from every namespace unless namespace is given
        WHEN the question is about problems or failures THEN pass fieldSelector type=Warning to leave out the Normal events
        WHEN the question names a namespace or one object THEN pass namespace, or fieldSelector involvedObject.name=<name>
      parameters:
        namespace:
          description: "ASSERT the exact namespace name; omit it for every namespace.\n{{ $noWildcard }}"
        fieldSelector:
          description: "ASSERT a server-side filter on event fields. Accepted fields: type (Normal or Warning), reason, involvedObject.kind, involvedObject.name, involvedObject.namespace, involvedObject.uid, involvedObject.apiVersion, involvedObject.resourceVersion, involvedObject.fieldPath, reportingComponent, source. For example type=Warning,involvedObject.kind=Pod."
    # The server's own helm_list text says it lists all namespaces by default; it lists
    # only its own namespace unless all_namespaces is true. Only the k8s-helm agent has
    # helm_list, so the route for a cluster without Secret read lives here, not in the
    # resources_list text every Kubernetes agent sees. A Flux HelmRelease names its chart
    # in spec.chart.spec, or points at a source through spec.chartRef and then carries the
    # chart only in status.history, so the text names both.
    - name: helm_list
      description: |-
        DESCRIPTION Lists Helm releases as YAML: name, namespace, revision, status, chart, chart and app version, last deployed
        WHEN the question names no namespace THEN pass all_namespaces=true
        WHEN the question names one namespace THEN pass namespace
        ASSERT with neither set it lists only the server's own namespace
        ASSERT Helm keeps each release in a Secret, so this tool needs Secret read on the server's account; without it every call fails with a forbidden error, which means the cluster did not grant that access, not that there are no releases
        WHEN this tool fails with a forbidden error THEN list the Flux HelmRelease objects instead: resources_list with apiVersion helm.toolkit.fluxcd.io/v2 and kind HelmRelease, and no namespace to cover every namespace
        WHEN reading a HelmRelease THEN take the chart name and version from status.history[0] (chartName, chartVersion, status), or from spec.chart.spec (chart, version) when present; status.lastAttemptedRevision is the version Flux last tried
        ASSERT a HelmRelease list holds only the releases Flux manages; report the answer as Flux-managed releases, not every release in the cluster
        WHEN resources_list says the HelmRelease kind is not served THEN report that the cluster has no Flux and that Helm releases cannot be listed without Secret read
        NEVER request kind Release or apiVersion helm.sh/v3: the API does not serve it, because Helm stores releases in Secrets
      parameters:
        namespace:
          description: "ASSERT lists only this namespace."
        all_namespaces:
          description: "ASSERT boolean true lists releases in every namespace."
  resources:
    {{- toYaml .Values.mcpServers.kubernetes.resources | nindent 4 }}
{{- end }}
---
{{- if .Values.mcpServers.kubernetesLegacy.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Release.Name }}-kubernetes-legacy-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" (printf "%s-kubernetes-legacy-mcp" .Release.Name)) }}
  image: {{ .Values.mcpServers.kubernetesLegacy.image }}
  transport: stdio
  port: 3000
  replicas: 1
  serviceAccountName: {{ .Release.Name }}-kubernetes-mcp
  securityMode: relaxed
  command:
    - "node"
    - "dist/index.js"
  capabilities:
    - kubernetes
    - kubectl
    - api-resources
  env:
    - name: SPAWN_MAX_BUFFER
      value: "10485760"
    {{- if not (include "homelab-pilot-crew.writeOn" .) }}
    # Registers only tools that do not change the cluster.
    - name: ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS
      value: "true"
    {{- end }}
  resources:
    {{- toYaml .Values.mcpServers.kubernetesLegacy.resources | nindent 4 }}
{{- end }}

{{- if .Values.mcpServers.proxmox.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: proxmox-pve
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "proxmox-pve") }}
  type: chat
  description: "Fetches live Proxmox VE host data through the Proxmox API: each hypervisor node's status, CPU, memory, and uptime, storage pools and their use, network bridges, LXC containers, cluster-wide totals, and task history."
  discussRole: tooler
  capabilities: [tool-calling]
  discussChannels:
    - proxmox
  triageSummary: "Answers questions about the Proxmox hypervisor hosts themselves: each node's status, uptime, and CPU and memory use, cluster-wide totals, storage backends (ZFS, NFS, Ceph, LVM) and free space, network bridges, LXC containers, and recent tasks. Virtual machines and their configuration belong to the VM agent."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, proxmox-pve-system]
  enabledTools: [list_nodes, get_node_status, get_node_rrd_data, list_storage, get_storage_content, get_node_networks, get_node_tasks, get_task_status, get_cluster_resources]
  discussKeywords:
    - proxmox
    - pve
    - hypervisor
    - node
    - storage
    - zfs
    - ceph
    - nfs
    - lvm
    - lxc
    - bridge
    - task
    - cluster
  temperature: "0.3"
  maxTokens: 4096
  think: false
  deployment:
    replicas: 1
    port: 8080
---
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: proxmox-qm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "proxmox-qm") }}
  type: chat
  description: "Fetches live Proxmox QEMU/KVM virtual machine data: the VM list with status and host node, each VM's configured CPU, memory, disks, and PCIe passthrough, its performance over time, and snapshots."
  discussRole: tooler
  capabilities: [tool-calling]
  # MUST be set or DiscussionSubscriber logs "No discussion channels configured
  # → subscriber inactive" and proxmox-qm never receives any thread message.
  # Discovered during Step 2 tuning sweep — proxmox-vm-list scenario hit 0/3
  # because proxmox-qm was silent (sibling proxmox-pve had ["proxmox"]).
  discussChannels:
    - proxmox
  triageSummary: "Answers questions about virtual machines on Proxmox: which VMs exist and are running and on which node, their configured cores, memory, disks, and passthrough devices, recent CPU, memory, disk, and network performance, and snapshots."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, proxmox-qm-system]
  enabledTools: [list_vms, get_vm_config, get_vm_rrd_data, list_vm_snapshots]
  discussKeywords:
    - proxmox
    - qemu
    - vm
    - vms
    - virtual
    - machine
    - machines
    - passthrough
    - hypervisor
    - snapshot
    - vfio
    - pcie
    - gpu
    - hardware
  temperature: "0.3"
  maxTokens: 4096
  think: false
  deployment:
    replicas: 1
    port: 8080
{{- end }}

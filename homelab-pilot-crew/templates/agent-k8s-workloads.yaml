{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-workloads") }}
  type: chat
  description: "Reads what runs and what it asks for: pods and their controllers, status, restarts, logs, images, and container CPU and memory requests and limits, including databases and other datastores."
  discussRole: tooler{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "write") }}
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers what runs in the cluster and what it asks for: pods and their controllers per namespace, pod phase and readiness, restart counts, container logs and images, and the CPU and memory each container requests and is limited to, which is the total requested that a capacity question compares with node allocatable. Includes databases and datastores, which run as StatefulSets."
  promptRefs: [crew-invariants, worker, k8s-workloads-system]
  enabledTools: [pods_list, pods_list_in_namespace, pods_get, pods_log, pods_top{{ if (include "homelab-pilot-crew.writeOn" $) }}, pods_exec{{ end }}, resources_list, resources_get, events_list]
  domains:
    - kubernetes
    - k8s
  discussKeywords:
    - pod
    - pods
    - deployment
    - deployments
    - daemonset
    - daemonsets
    - statefulset
    - statefulsets
    - replicaset
    - replicasets
    - job
    - jobs
    - cronjob
    - cronjobs
    - logs
    - restarts
    - container
    - containers
    - crashloop
    - oom
    - image
    - workload
    - workloads
    - requests
    - limits
    - database
    - datastore
    - postgres
    - postgresql
    - redis
    - mysql
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
{{- end }}

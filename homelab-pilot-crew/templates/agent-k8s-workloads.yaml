apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-workloads") }}
  type: chat
  description: "Fetches live workload data from the Kubernetes API: Pods, Deployments, StatefulSets, DaemonSets, ReplicaSets, Jobs, and CronJobs in any or all namespaces, with pod status, restarts, logs, events, images, and each container's CPU and memory requests and limits."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers what runs in the cluster and what it asks for: pods and their controllers per namespace, pod phase and readiness, restart counts, container logs and images, and the CPU and memory each container requests and is limited to, which is the total requested that a capacity question compares with node allocatable. Includes databases and datastores, which run as StatefulSets."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-workloads-system]
  enabledTools: [pods_list, pods_list_in_namespace, pods_get, pods_log, pods_top{{ if (include "homelab-pilot-crew.writeOn" $) }}, pods_exec{{ end }}, resources_list, resources_get, events_list]
  discussKeywords:
    - kubernetes
    - k8s
    - pod
    - pods
    - deployment
    - deployments
    - daemonset
    - daemonsets
    - statefulset
    - statefulsets
    - replicaset
    - replicasets
    - job
    - jobs
    - cronjob
    - cronjobs
    - logs
    - log
    - restart
    - restarts
    - container
    - containers
    - replica
    - replicas
    - crash
    - crashloop
    - oom
    - running
    - status
    - image
    - workload
    - workloads
    - describe
    - unhealthy
    - healthy
    - failing
    - failed
    - error
    - pending
    - event
    - events
    - request
    - requests
    - requested
    - limit
    - limits
    - database
    - datastore
    - postgres
    - postgresql
    - redis
    - mysql
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

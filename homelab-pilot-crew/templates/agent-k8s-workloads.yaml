apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-workloads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Inspects Kubernetes workloads: Deployments, StatefulSets, DaemonSets, ReplicaSets, Jobs, CronJobs, and Pods."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Lists and inspects Deployments, StatefulSets, DaemonSets, ReplicaSets, Jobs, CronJobs, and Pods, including database and datastore workloads (which run as StatefulSets). Reads pod logs, container status, restart counts, and events."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-workloads-system]
  enabledTools: [pods_list, pods_list_in_namespace, pods_get, pods_log, pods_top, pods_exec, resources_list, resources_get, events_list]
  discussKeywords:
    - kubernetes
    - k8s
    - pod
    - pods
    - deployment
    - deployments
    - daemonset
    - daemonsets
    - statefulset
    - statefulsets
    - replicaset
    - replicasets
    - job
    - jobs
    - cronjob
    - cronjobs
    - logs
    - log
    - restart
    - restarts
    - container
    - containers
    - replica
    - replicas
    - crash
    - crashloop
    - oom
    - running
    - status
    - image
    - workload
    - workloads
    - describe
    - unhealthy
    - healthy
    - failing
    - failed
    - error
    - pending
    - event
    - events
    - database
    - datastore
    - postgres
    - postgresql
    - redis
    - mysql
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

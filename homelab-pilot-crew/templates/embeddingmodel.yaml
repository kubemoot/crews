{{- if hasKey .Values.embeddingModel "providerRef" }}
{{- fail "embeddingModel.providerRef is gone: leave embeddingModel.serverRef out and the cluster supplies a server, or set serverRef to pin a ModelServer" }}
{{- end }}
apiVersion: kubemoot.ai/v1alpha1
kind: EmbeddingModel
metadata:
  name: {{ .Values.embeddingModel.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by-resource: kubemoot
spec:
  model: {{ .Values.embeddingModel.modelId }}
  dimensions: {{ .Values.embeddingModel.dimensions | default 768 }}
  {{- with .Values.embeddingModel.serverRef }}
  serverRef: {{ . }}
  {{- end }}

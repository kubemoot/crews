{{- if hasKey .Values.embeddingModel "providerRef" }}
{{- fail "embeddingModel.providerRef is now embeddingModel.serverRef: set serverRef to the ModelServer that serves the embedding model" }}
{{- end }}
apiVersion: kubemoot.ai/v1alpha1
kind: EmbeddingModel
metadata:
  name: {{ .Values.embeddingModel.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by-resource: kubemoot
spec:
  model: {{ .Values.embeddingModel.modelId }}
  serverRef: {{ required "embeddingModel.serverRef is required: the ModelServer that serves the embedding model" .Values.embeddingModel.serverRef }}

{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: obs-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "obs-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "obs-advisor") }}
  type: chat
  description: "Answers conceptual observability questions about Prometheus, Grafana, and monitoring from documentation (RAG). Has NO live tools."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning]
  think: true
  discussChannels:
    - observability
    - general
  triageSummary: "Reviews the observability and metrics data other agents fetched (cross-checks and correlates it) and answers conceptual Prometheus, PromQL, Grafana, and alerting questions from documentation. Fetches no live data."
  promptRefs: [discussion-protocol, {{ include "homelab-pilot-crew.peerVerificationRef" . }}ratify-prompt, response-style, obs-advisor-system, analyst-review-protocol]
  enabledTools: [workspace_head, workspace_tail, workspace_grep{{ if .Values.advisors.workspaceQuery }}, workspace_query{{ end }}{{ include "homelab-pilot-crew.ragSearchTools" (dict "root" $ "name" "obs-advisor") }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.advisors.workspaceQuery "tools" (list "workspace_query")) }}
  domains:
    - observability
    - prometheus
    - grafana
    - monitoring
    - alerting
  discussKeywords:
    - prometheus
    - promql
    - grafana
    - alertmanager
    - monitoring
    - observability
    - metrics
    - metric
    - counter
    - gauge
    - histogram
    - summary
    - recording-rule
    - alerting
    - alert
    - servicemonitor
    - podmonitor
    - prometheusrule
    - scrape
    - remote-write
    - opentelemetry
    - dashboard
    - rate
    - increase
    - irate
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Analyst reasoner: gateway ON but enabledTools (spec) scopes it to exactly the
      # workspace read tools, so triage sees ONLY those, not the full 176-tool
      # catalog that made it CONTRIBUTE to everything. Those tools READ the discussion workspace
      # data under marker-only posting; they are NOT domain tools.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
      # Domain-strict triage: out-of-domain analysts stand aside (DRY via helper).
      - name: KUBEMOOT_DISCUSS_TRIAGE_PROMPT
        value: {{ include "homelab-pilot-crew.analystTriagePrompt" . | quote }}
{{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: obs-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Answers conceptual observability questions about Prometheus, Grafana, and monitoring from documentation (RAG). Has NO live tools."
  discussRole: analyst
  capabilities: [reasoning]
  think: true
  discussChannels:
    - observability
    - general
  triageSummary: "Reviews and reasons over observability and metrics data the toolers gathered (computes rates and aggregates, correlates) and answers conceptual Prometheus, PromQL, Grafana, and alerting questions. Relevant to any observability-domain question."
  promptRefs: [discussion-protocol, response-style, obs-advisor-system, analyst-review-protocol]
  enabledTools: [artifact_head, artifact_tail, artifact_grep, artifact_count, artifact_rows, artifact_select, artifact_jq]
  discussKeywords:
    - prometheus
    - promql
    - grafana
    - alertmanager
    - monitoring
    - observability
    - metrics
    - metric
    - counter
    - gauge
    - histogram
    - summary
    - recording-rule
    - alerting
    - alert
    - servicemonitor
    - podmonitor
    - prometheusrule
    - scrape
    - remote-write
    - opentelemetry
    - dashboard
    - rate
    - increase
    - irate
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Analyst reasoner: gateway ON but enabledTools (spec) scopes it to exactly the
      # 7 artifact read-ops tools, so triage sees ONLY those, not the full 176-tool
      # catalog that made it CONTRIBUTE to everything. Those tools READ spilled-artifact
      # data under marker-only posting; they are NOT domain tools.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
      # Domain-strict triage: out-of-domain analysts stand aside (DRY via helper).
      - name: KUBEMOOT_DISCUSS_TRIAGE_PROMPT
        value: {{ include "homelab-pilot-crew.analystTriagePrompt" . | quote }}

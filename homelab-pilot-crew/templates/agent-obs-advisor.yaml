{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: obs-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "obs-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "obs-advisor") }}
  type: chat
  description: "Reviews and fact-checks the monitoring findings against the stored results, the live Prometheus metrics and the Prometheus documentation, and asks the agent behind a doubtful finding to recheck it."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning, tool-calling]
  think: true
  discussChannels:
    - observability
    - general
  triageSummary: "Checks the monitoring facts other agents reported (metrics, monitors, alerting rules, firing alerts) against the stored results, the live metrics and the Prometheus and PromQL documentation, says where a finding misreads what a metric, monitor or rule means, and asks the agent that reported a doubtful fact to recheck it. Adds no data of its own."
  promptRefs: [crew-invariants, advisor, obs-advisor-system]
  enabledTools: [{{ include "homelab-pilot-crew.advisorTools" (dict "root" $ "name" "obs-advisor" "live" (ternary (list "execute_query") list .Values.mcpServers.prometheus.enabled)) }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.advisors.workspaceQuery "tools" (list "workspace_query" "workspace_describe")) }}
  domains:
    - observability
    - prometheus
    - grafana
    - monitoring
    - alerting
  discussKeywords:
    - prometheus
    - promql
    - grafana
    - alertmanager
    - monitoring
    - observability
    - metrics
    - metric
    - counter
    - gauge
    - histogram
    - summary
    - recording-rule
    - alerting
    - alert
    - servicemonitor
    - podmonitor
    - prometheusrule
    - scrape
    - remote-write
    - opentelemetry
    - dashboard
    - rate
    - increase
    - irate
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Gateway ON, scoped by enabledTools to the read and compute tools above.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
{{- end }}

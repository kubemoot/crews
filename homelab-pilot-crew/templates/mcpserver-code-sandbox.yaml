{{- if include "homelab-pilot-crew.rbacTenant" . }}
{{- if .Values.mcpServers.codeSandbox.enabled }}
{{- $transport := .Values.mcpServers.codeSandbox.transport | default "stdio" }}
{{- if not (has $transport (list "stdio" "http")) }}
{{- fail (printf "mcpServers.codeSandbox.transport must be stdio or http, got %q" $transport) }}
{{- end }}
{{- $port := 3000 }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: code-sandbox-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "code-sandbox-mcp") }}
  description: "Runs a short Python or bash program an agent writes, inside an isolated pod with a time limit and capped output, and returns stdout, stderr, and the exit code."
  # Kubemoot code-sandbox: the agent writes a short Python or bash program, the
  # server runs it inside THIS pod (no stdin, a time limit that kills the whole
  # process group, capped output) and returns stdout, stderr and the exit code.
  {{- if eq $transport "http" }}
  # Tools: execute_code and validate_code. Streamable HTTP -> no bridge sidecar.
  {{- else }}
  # Tools: execute_code and validate_code. Pure stdio -> operator adds the bridge
  # sidecar (port below is the bridge's TCP port, not a server listener).
  {{- end }}
  image: {{ include "homelab-pilot-crew.image" (dict "root" $ "image" .Values.mcpServers.codeSandbox.image) | quote }}
  transport: {{ $transport }}
  {{- if eq $transport "http" }}
  # The server listens on the port itself (Streamable HTTP at /mcp) and the
  # operator adds no bridge and no pipes volume. No explicit command: the image
  # launcher (/cnb/process/web, the image entrypoint) starts the server under tini,
  # which reaps processes a killed program leaves behind.
  healthPath: /healthz
  readinessPath: /readyz
  {{- else }}
  # The bridge runs in exec mode (kubemoot-mcp-bridge exec -- <command>), so the
  # server's start command must be explicit: the image's Paketo launcher, which
  # starts the server under tini (tini reaps processes a killed program leaves
  # behind). Needs a code-sandbox image built with Paketo buildpacks.
  command:
    - "/cnb/process/web"
  {{- end }}
  port: {{ $port }}
  replicas: 1
  # The pod runs the sandbox as 1000:1000 in the default (relaxed) security mode, whatever
  # user the image sets: 1000 is the workspace-access materializer's user, and the Paketo
  # image's own user is 1002. The operator keeps drop-ALL capabilities, no privilege
  # escalation and the RuntimeDefault seccomp profile around these.
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
  {{- with .Values.mcpServers.codeSandbox.runtimeClassName }}
  runtimeClassName: {{ . | quote }}
  {{- end }}
  # Option A: NO cluster credentials. This sandbox only computes over data handed
  # to it on the discussion board; it needs NO Kubernetes access, so it does NOT
  # use the kubernetes-mcp service account (default namespace SA, no RBAC bound).
  env:
    # Below the gateway's 30 s tool-call timeout, so a program that runs too long
    # comes back as the sandbox's own "stopped" result, not a gateway error.
    - name: EXECUTION_TIMEOUT
      value: "25"
    {{- if eq $transport "http" }}
    - name: MCP_TRANSPORT
      value: "http"
    - name: PORT
      value: {{ $port | quote }}
    {{- end }}
  capabilities:
    - compute
    - data-analysis
  # What the sandbox has, said once on its tool for every agent that runs code.
  toolOverrides:
    - name: execute_code
      description: |-
        DESCRIPTION Runs a short Python 3 or bash program in an isolated sandbox and returns its stdout, stderr and exit code; a program that runs past the time limit is stopped
        ASSERT Python has the standard library only (json, csv, collections, statistics, math, itertools, re); pandas, numpy and every other third-party package are not installed, and importing one fails
        ASSERT the sandbox has no network and no cluster access
        ASSERT a program reads a stored result of this discussion in full: name its key in inputs, for example inputs: ["k8s-config/001-resources_get"], and the program opens the file ./inputs/k8s-config/001-resources_get; a count, filter or total is computed over all of that file, not over rows copied out of a slice
        ASSERT a stored result may hold a table as text inside a YAML or JSON field (a ConfigMap with a CSV in data), which the program parses itself, and workspace_query cannot split into rows
        ASSERT only this discussion's stored results can be named; a key of another discussion or one that does not exist is refused
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Shared scratch the materializer writes and the sandbox reads. The operator
  # mounts this emptyDir into BOTH the main container and the sidecar at the same
  # path (EmptyDirVolume has no name; the operator auto-shares it).
  emptyDirVolumes:
    - mountPath: /kubemoot/workspace
      sizeLimit: 256Mi
  # Materializer sidecar (native sidecar; operator sets restartPolicy=Always and
  # auto-mounts /kubemoot/workspace). It reaches NATS to fetch referenced objects and
  # stages them on /kubemoot/workspace for the no-network sandbox. The sandbox container
  # itself has no NATS client; egress for this pod is locked to NATS-only by
  # networkpolicy-code-sandbox.yaml (A1 posture; cross-crew isolation needs
  # per-crew NATS accounts, which are not implemented yet).
  sidecars:
    - name: workspace-access
      image: {{ include "homelab-pilot-crew.image" (dict "root" $ "image" (include "homelab-pilot-crew.workspaceImage" $)) | quote }}
      env:
        - name: NATS_URL
          value: {{ .Values.nats.url | quote }}
        - name: WORKSPACE_DIR
          value: "/kubemoot/workspace"
        - name: WORKSPACE_BUCKET
          value: "kubemoot_workspace"
        # Crew-scoped subscription (soft boundary): only this crew's references.
        - name: WORKSPACE_SUBJECT
          value: "kubemoot.artifacts.{{ .Release.Namespace }}.{{ .Values.crew.name }}.>"
      securityContext:
        # Runs non-root: the workspace-access image sets USER 1000, and this enforces
        # uid:gid 1000:1000 at the pod layer too (defense in depth). runAsUser also
        # makes the runtime user independent of the image tag, so this is safe whether
        # or not the USER-1000 image is the one live. 1000 matches the sandbox reader,
        # and the shared /kubemoot/workspace emptyDir is 0777 so the materializer writes fine as
        # non-root (verified live). Still contained by read-only rootfs + drop-ALL caps
        # + no-privilege-escalation + NATS-only egress.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
{{- end }}
{{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8sgpt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "AI-powered Kubernetes diagnostics via k8sgpt analysis."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Cluster-wide diagnostics: runs K8sGPT deterministic analyzers to detect misconfigurations (Pods, Services, Ingresses, Deployments, StatefulSets, PVCs, NetworkPolicies) AND surfaces Kubernetes Events/warnings from any object (kubelet, scheduler, nodes, storage, controllers)."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8sgpt-system]
  enabledTools: [analyze, cluster-info, events_list]
  discussKeywords:
    - analyze
    - analysis
    - problems
    - issues
    - diagnostics
    - troubleshoot
    - health
    - unhealthy
    - event
    - events
    - warning
    - warnings
    - recent activity
    - misconfigured
    - misconfiguration
    - crashloop
    - pending
    - failed
    - error
    - warnings
    - cluster-health
    - scan
    - check
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

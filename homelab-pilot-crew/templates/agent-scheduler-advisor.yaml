{{- if include "homelab-pilot-crew.rbacTenant" . }}
{{- if .Values.mcpServers.scheduling.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: scheduler-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ .Values.crew.name }}
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "scheduler-advisor") }}
  type: chat
  description: "Sets, lists and cancels reminders and follow-up discussions for the person asking."
  discussRole: tooler{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "write") }}
  think: false
  capabilities: [tool-calling]
  discussChannels:
    - general
    - scheduler
  triageSummary: "Handles scheduling requests: reminders ('remind me in 30 minutes'), follow-up discussions ('re-check disk usage tomorrow at 9am'), listing pending schedules, and cancellation."
  # Temporal phrasing is unbounded ("in three minutes", "at the end of
  # the day", "every Monday for a month", "give it a few minutes then
  # re-look"). Keyword-list matching cannot keep up. LLM mode asks the
  # triage model whether the user message looks like a scheduling
  # request, with the promptHint biasing toward temporal intent.
  discussRelevance:
    mode: llm
    promptHint: |
      DEFINE COMPONENT scheduler-relevance
      DESCRIPTION Whether the message asks for something at a later time
      WHEN the person wants something done at a future time, after a delay, on a recurring cadence, or an earlier step done again later THEN say yes
      WHEN the person wants an answer now, with no later time in the request THEN say no
  promptRefs: [crew-invariants, scheduler-advisor-system]
  discussKeywords:
    - remind
    - reminder
    - schedule
    - scheduled
    - follow-up
    - followup
    - later
    - "in 30"
    - "in an hour"
    - "in 1 hour"
    - "in 2 hours"
    - "in 10 minutes"
    - cancel
    - cancel reminder
    - delete reminder
    - re-ask
    - reask
  enabledTools:
    - set_reminder
    - schedule_followup
    - list_scheduled
    - cancel_scheduled
  maxTokens: 2048
  deployment:
    replicas: 1
    port: 8080
{{- end }}
{{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-services
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-services") }}
  type: chat
  description: "Fetches live networking objects from the Kubernetes API: Services with type, ports, and cluster and external IPs, Endpoints, Ingresses with hosts and paths, and NetworkPolicies in any or all namespaces."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers how traffic reaches workloads: which Services exist with their type, ports, and selectors, which endpoints back them, Ingress hosts and paths, and which namespaces have NetworkPolicies and which have none."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-services-system]
  enabledTools: [resources_list, resources_get, events_list]
  discussKeywords:
    - service
    - services
    - nodeport
    - loadbalancer
    - clusterip
    - externalname
    - endpoint
    - endpoints
    - ingress
    - ingresses
    - networkpolicy
    - port
    - ports
    - expose
    - exposed
    - external
    - dns
    - routing
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-storage") }}
  type: chat
  description: "Fetches live storage objects from the Kubernetes API: PersistentVolumes, PersistentVolumeClaims, and StorageClasses, with size, access modes, bound status, reclaim policy, and provisioner."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers questions about persistent storage: which claims exist and whether they are bound, their requested size, the volumes behind them, access modes, reclaim policies, and the StorageClasses and provisioners that create them."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-storage-system]
  enabledTools: [resources_list, resources_get, events_list]
  discussKeywords:
    - pv
    - pvc
    - pvcs
    - volume
    - volumes
    - storage
    - storageclass
    - persistent
    - claim
    - claims
    - nfs
    - csi
    - disk
    - capacity
    - bound
    - provisioner
    - reclaim
    - access
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

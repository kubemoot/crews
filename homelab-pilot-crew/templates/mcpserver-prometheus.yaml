{{- if include "homelab-pilot-crew.rbacTenant" . }}
{{- if .Values.mcpServers.prometheus.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: prometheus-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "prometheus-mcp") }}
  description: "Queries Prometheus with PromQL: current values, ranges over time, and what metrics and labels exist."
  {{- include "homelab-pilot-crew.smokeInputs" (dict "root" $ "name" "prometheus") }}
  image: ghcr.io/pab1it0/prometheus-mcp-server@sha256:ed91f3f9e4f6fb92c5b8fd48a29f3382c11498de405f59da5eac16398d47d43b
  transport: stdio
  command:
    - "/app/.venv/bin/prometheus-mcp-server"
  port: 3000
  # replicas: 2. The stdio MCP server exits cleanly (exit code 0) when the
  # gateway closes its bridge connection, and Kubernetes restarts it within
  # about a second. With a single replica, a tool call that lands in that window
  # times out. Two replicas behind one Service keep one answering while the
  # other restarts. The agent runtime also reports a failed tool call as a
  # failure signal instead of waiting on it.
  replicas: 2
  env:
    - name: PROMETHEUS_URL
      value: {{ .Values.mcpServers.prometheus.endpoint | quote }}
  capabilities:
    - prometheus
    - promql
    - metrics
    - monitoring
  # The descriptions agents see: what each tool returns and how large. PromQL itself is how a
  # query asks for less (topk, aggregation by a label, a function over a range), and Prometheus
  # rejects a bare range vector inside an aggregation with a 400 error. list_metrics returns
  # every metric name unless filter_pattern and limit narrow it.
  {{- $rangeFact := "ASSERT a rate or a value over time takes the range vector inside rate(...[5m]) or a *_over_time function such as avg_over_time(...[5m]) before any aggregation, for example sum by (namespace) (rate(metric_total[5m]))\nASSERT Prometheus rejects a bare range vector passed to sum, avg, max, count or topk, such as sum(metric[5m]), with a 400 error" }}
  {{- $emptyFact := "ASSERT an empty result usually means a wrong metric name or label value: list_metrics shows the metric names that exist, and the bare metric with no label filter shows the labels its series carry, which differ between clusters" }}
  toolOverrides:
    - name: execute_query
      description: |-
        DESCRIPTION Runs one PromQL instant query and returns every series it matches with all its labels, so the result grows with the number of series
        ASSERT topk(5, ...) or bottomk(5, ...) returns only the largest or smallest few series, and sum by (label) (...) or count by (label) (...) returns one series per group
        {{- $rangeFact | nindent 8 }}
        ASSERT count by (job) (up) lists the scrape jobs, and up == 0 lists the targets that are down
        {{ $emptyFact }}
    - name: execute_range_query
      description: |-
        DESCRIPTION Runs one PromQL range query and returns every sample of every series it matches from start to end at each step
        ASSERT the result size is the number of series times (end - start) / step; a few series (sum by, topk) and a step of about 60 points, such as 1m for an hour or 30m for a day, keep a trend small
        ASSERT max_over_time(...[1h]) or avg_over_time(...[1h]) with start equal to end returns one point per series: one number over the window
        {{- $rangeFact | nindent 8 }}
        {{ $emptyFact }}
    - name: list_metrics
      description: |-
        DESCRIPTION Lists the metric names Prometheus knows, with total_count and has_more; with no filter it returns every name, which is very large
        ASSERT filter_pattern and limit keep the reply small; limit=1 with a filter_pattern returns total_count, the number of matching names
        ASSERT has_more true means more names follow at a higher offset
      parameters:
        filter_pattern:
          description: "ASSERT a case-insensitive substring of the metric names wanted, such as DCGM_FI_ or apiserver_request."
        limit:
          description: "ASSERT the most names to return, for example 50; omitted returns every name."
    - name: get_metric_metadata
      description: |-
        DESCRIPTION Returns the type, help text and unit of metrics; with no metric and no filter it returns the metadata of every metric, which is very large
        ASSERT metric with an exact name returns that one metric's entry; filter_pattern and limit narrow a search
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
{{- end }}
{{- end }}

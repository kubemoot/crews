apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-scaling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-scaling") }}
  type: chat
  description: "Fetches live autoscaling and quota objects from the Kubernetes API: HorizontalPodAutoscalers with current and desired replicas and targets, VerticalPodAutoscalers, ResourceQuotas with namespace limits and use, and LimitRanges.{{ if (include "homelab-pilot-crew.writeOn" $) }} Scales a Deployment's or StatefulSet's replicas.{{ end }}"
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes]
  discussChannels:
    - kubernetes
  triageSummary: "Answers how workloads scale and what each namespace is allowed: HPA current, desired, minimum, and maximum replicas and their metric targets, VPA recommendations, ResourceQuota hard limits and used amounts per namespace, and LimitRange container defaults.{{ if (include "homelab-pilot-crew.writeOn" $) }} Also scales a workload's replicas when asked.{{ end }}"
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-scaling-system]
  enabledTools: [resources_list, resources_get{{ if (include "homelab-pilot-crew.writeOn" $) }}, resources_scale{{ end }}, pods_top, events_list]
  discussKeywords:
    - hpa
    - vpa
    - autoscale
    - autoscaler
    - scale
    - scaling
    - quota
    - resourcequota
    - limitrange
    - replicas
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

{{- if include "homelab-pilot-crew.rbacTenant" . }}
{{- if .Values.mcpServers.k8sgpt.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: k8sgpt-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "mcpServers" "name" "k8sgpt-mcp") }}
  description: "Analyzes the cluster's Kubernetes resources with K8sGPT and reports the problems it finds, without any language model of its own."
  {{- include "homelab-pilot-crew.smokeInputs" (dict "root" $ "name" "k8sgpt") }}
  image: {{ .Values.mcpServers.k8sgpt.image }}
  transport: stdio
  command:
    - "/k8sgpt"
    - "serve"
    - "--mcp"
    - "--port"
    - "3000"
    - "--metrics-port"
    - "3001"
  port: 3000
  replicas: 1
  serviceAccountName: {{ .Release.Name }}-k8sgpt-mcp
  env:
    - name: K8SGPT_BACKEND
      value: "noopai"
    - name: K8SGPT_PASSWORD
      value: "none"
    - name: K8SGPT_MODEL
      value: "none"
  capabilities:
    - kubernetes
    - analysis
    - troubleshooting
    - diagnostics
  # The server runs with the noopai backend: the analyzers are deterministic and no language
  # model explains their results, so the gateway refuses explain and backend before the call.
  toolOverrides:
    - name: analyze
      description: |-
        DESCRIPTION Runs the K8sGPT analyzers over the cluster, or one namespace, and returns each problem found with its object (kind, name, namespace) and the analyzer's error text
        ASSERT filters limits the run to analyzers by kind: Pod, Service, Ingress, Deployment, StatefulSet, ReplicaSet, PersistentVolumeClaim, Node, CronJob, NetworkPolicy, HorizontalPodAutoscaler
        ASSERT an empty result means the analyzers found no problem
      parameters:
        explain:
          description: "ASSERT not used by this server: it has no language model, so explain is always false."
          rules:
            - reject: '(?i)^\s*true\s*$'
              message: "ASSERT explain is not available: this server runs the analyzers without a language model.\nASSERT a call without explain returns the analyzers' findings."
        backend:
          description: "ASSERT not used by this server: it runs the analyzers without a language model."
          rules:
            - reject: '\S'
              message: "ASSERT backend is not available: this server runs the analyzers without a language model.\nASSERT a call without backend returns the analyzers' findings."
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
{{- end }}
{{- end }}

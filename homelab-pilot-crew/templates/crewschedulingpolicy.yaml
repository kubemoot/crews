{{/*
CrewSchedulingPolicy for the homelab-pilot crew.

The crew ships no Model objects and names no model provider. The cluster
owner's model catalog supplies the models (Model objects in the operator
namespace plus the models each ModelProvider reports), and the scheduler
matches these per-phase rules against the catalog's labels:
kubemoot.ai/size (small, medium, large), capability/tool-calling,
capability/reasoning, kubemoot.ai/context-tokens. No Agent names a model or a
size; the same chart runs on a cluster with one small model and on one with
several accelerators.

See the Kubemoot scheduler documentation, sections "Quality bias",
"Selecting from the model catalog", and "Preferring the faster model".
*/}}
apiVersion: kubemoot.ai/v1alpha1
kind: CrewSchedulingPolicy
metadata:
  name: {{ .Values.crew.name }}-scheduling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  crewRef: {{ .Values.crew.name | quote }}
  archetypeRef: consent-3
  {{- with .Values.crew.placementPolicy }}
  placementPolicy: {{ . | quote }}
  {{- end }}
  # Per-capability quality bias, read against each model's size class. Each
  # scalar is in [0.0, 1.0]: low leans to small models, high to large ones, and
  # the middle band (about 0.33 to 0.67) lands on medium, whose score peaks at
  # 0.5. An agent's effective bias is the max of qualityBias[c] over its
  # declared spec.capabilities, falling back to default when none match.
  # Strings, because the CRD field is map[string]string (no float precision
  # surprises in OpenAPI).
  qualityBias:
    reasoning: "0.7"        # synthesis and multi-step reasoning lean to large models
    tool-calling: "0.5"     # toolers land on medium: small models mis-formulate resource queries and under-report
    observability: "0.4"    # a slight quality nudge, still medium
    kubernetes: "0.4"
    default: "0.4"          # for capabilities not listed above
  rules:
    - phase: mulling
      require:
        matchLabels:
          capability/tool-calling: "true"
      # No prefer block, so each agent's score comes from qualityBias (size)
      # plus the abilities it declares. An explicit prefer list here would
      # replace both for this rule.
    - phase: triage
      require:
        matchLabels:
          capability/tool-calling: "true"
      # Triage, the advisory call, and LLM relevance checks are short
      # classification calls: their need is speed, and size is not a proxy
      # for it (a small model on a CPU can be far slower than a medium one on
      # an accelerator). preferFaster adds up to 50 points to each candidate
      # in proportion to its measured generation speed relative to the
      # fastest candidate, applied by the agent runtime on each call.
      preferFaster: 50
      # This prefer term matches every model the rule admits, so it adds the
      # same weight to each and ranks nothing. It is here because any explicit
      # prefer turns off the qualityBias and ability scores for the rule;
      # without it the coordinator's reasoning bias would rank the large model
      # first before speed is considered, and bind triage to it.
      prefer:
        - weight: 1
          selector:
            matchLabels:
              capability/tool-calling: "true"

{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "k8s-advisor") }}
  type: chat
  description: "Answers conceptual Kubernetes questions from documentation (RAG). Has NO live cluster tools."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning]
  think: true
  discussChannels:
    - kubernetes
    - general
  triageSummary: "Reviews the Kubernetes data other agents fetched (cross-checks and correlates the facts, flags gaps) and answers conceptual Kubernetes, Helm, RBAC, and networking questions from documentation. Fetches no live data."
  promptRefs: [discussion-protocol, response-style, k8s-advisor-system, analyst-review-protocol]
  enabledTools: [workspace_head, workspace_tail, workspace_grep{{ if .Values.advisors.workspaceQuery }}, workspace_query{{ end }}{{ include "homelab-pilot-crew.ragSearchTools" (dict "root" $ "name" "k8s-advisor") }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.advisors.workspaceQuery "tools" (list "workspace_query")) }}
  domains:
    - kubernetes
    - k8s
    - helm
  discussKeywords:
    - concept
    - explain
    - difference
    - compare
    - best-practice
    - bestpractice
    - pattern
    - architecture
    - recommend
    - recommendation
    - troubleshoot
    - debug
    - tutorial
    - kubernetes
    - k8s
    - helm
    - talos
    - rbac
    - operator
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Analyst reasoner: gateway ON but enabledTools (spec) scopes it to exactly the
      # workspace read tools, so triage sees ONLY those, not the full 176-tool
      # catalog that made it CONTRIBUTE to everything. Those tools READ the discussion workspace
      # data under marker-only posting; they are NOT domain tools.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
      # Domain-strict triage: out-of-domain analysts stand aside (DRY via helper).
      - name: KUBEMOOT_DISCUSS_TRIAGE_PROMPT
        value: {{ include "homelab-pilot-crew.analystTriagePrompt" . | quote }}
{{- end }}

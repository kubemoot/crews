{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "k8s-advisor") }}
  type: chat
  description: "Reviews and fact-checks the Kubernetes findings against the stored results, the live cluster and the Kubernetes documentation, and asks the agent behind a doubtful finding to recheck it."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning, tool-calling]
  think: true
  discussChannels:
    - kubernetes
    - general
  triageSummary: "Checks the Kubernetes facts other agents reported (each number, name, count and state) against the stored results, the live cluster and the Kubernetes, kubectl and Helm documentation, says where a finding misreads what a resource or field means, and asks the agent that reported a doubtful fact to recheck it. Adds no data of its own."
  promptRefs: [crew-invariants, advisor, k8s-advisor-system]
  enabledTools: [{{ include "homelab-pilot-crew.advisorTools" (dict "root" $ "name" "k8s-advisor" "live" (ternary (list "resources_list" "resources_get" "pods_list" "pods_list_in_namespace" "events_list") list .Values.mcpServers.kubernetes.enabled)) }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.advisors.workspaceQuery "tools" (list "workspace_query" "workspace_describe")) }}
  domains:
    - kubernetes
    - k8s
    - helm
  discussKeywords:
    - concept
    - explain
    - difference
    - compare
    - best-practice
    - bestpractice
    - pattern
    - architecture
    - recommend
    - recommendation
    - troubleshoot
    - debug
    - tutorial
    - kubernetes
    - k8s
    - helm
    - rbac
    - operator
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Gateway ON, scoped by enabledTools to the read and compute tools above.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
{{- end }}

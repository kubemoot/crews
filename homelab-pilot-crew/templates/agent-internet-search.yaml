{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: internet-search
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "internet-search") }}
  type: chat
  description: "Searches the web for outside documentation, releases and tools the crew's own systems cannot tell."
  discussRole: researcher{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "write") }}
  capabilities: [tool-calling]
  discussChannels:
    - kubernetes
    - observability
    - proxmox
    - general
  triageSummary: "Searches the internet for outside documentation, release notes, other tools and known problems, for technologies the crew's own agents cannot read."
  promptRefs: [crew-invariants, worker, internet-search-system]
  enabledTools: [search, fetch_content]
  discussKeywords: [documentation, docs, release, releases, latest, upstream, alternative, alternatives, compare, web, internet]
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
{{- end }}

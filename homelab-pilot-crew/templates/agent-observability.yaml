apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: obs-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "obs-metrics") }}
  type: chat
  description: "Fetches live monitoring-stack data: health of the Prometheus, Grafana, Alertmanager, Loki, and OpenTelemetry pods, ServiceMonitors, PodMonitors, alerting rules, firing alerts, and PromQL queries that investigate an alert or the stack itself."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, observability]
  discussChannels:
    - observability
  triageSummary: "Answers whether monitoring works and what it alerts on: monitoring pods running or restarting and their logs, ServiceMonitors, PodMonitors, PrometheusRules, firing alerts, and PromQL queries that investigate an alert or the stack itself."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, obs-metrics-system]
  enabledTools: [pods_list_in_namespace, pods_get, pods_log, resources_list, execute_query, execute_range_query, list_metrics]
  discussKeywords:
    - prometheus
    - grafana
    - alertmanager
    - alert
    - alerts
    - metric
    - metrics
    - monitoring
    - dashboard
    - promql
    - loki
    - trace
    - tracing
    - opentelemetry
    - servicemonitor
    - scrape
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      - name: KUBEMOOT_MODEL_MAX_TOOL_ITERATIONS
        value: "15"

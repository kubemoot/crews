{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: proxmox-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "proxmox-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "proxmox-advisor") }}
  type: chat
  description: "Reviews and fact-checks the Proxmox findings against the stored results, the live hypervisor and the Proxmox documentation, and asks the agent behind a doubtful finding to recheck it."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning, tool-calling]
  think: true
  discussChannels:
    - proxmox
    - general
  triageSummary: "Checks the Proxmox facts other agents reported (hosts, VMs, containers, storage) against the stored results, the live Proxmox API and the Proxmox VE documentation, says where a finding misreads what a host, VM or storage setting means, and asks the agent that reported a doubtful fact to recheck it. Adds no data of its own."
  promptRefs: [crew-invariants, advisor, proxmox-advisor-system]
  enabledTools: [{{ include "homelab-pilot-crew.advisorTools" (dict "root" $ "name" "proxmox-advisor" "live" (ternary (list "list_nodes" "list_vms" "get_cluster_resources") list .Values.mcpServers.proxmox.enabled)) }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.advisors.workspaceQuery "tools" (list "workspace_query" "workspace_describe")) }}
  domains:
    - proxmox
    - pve
    - hypervisor
    - virtualization
  discussKeywords:
    - proxmox
    - pve
    - pvesh
    - qm
    - pct
    - vzdump
    - pvesm
    - configure
    - setup
    - howto
    - command
    - cli
    - guide
    - tutorial
    - backup
    - restore
    - passthrough
    - ha
    - corosync
    - pcie
    - iommu
    - vfio
    - gpu
    - zfs
    - ceph
    - nfs
    - vlan
    - sdn
    - bridge
    - network
    - firewall
    - cluster
    - replication
    - template
    - cloudinit
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Gateway ON, scoped by enabledTools to the read and compute tools above.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
{{- end }}

apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: proxmox-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Answers conceptual Proxmox questions from documentation (RAG). Has NO live tools."
  discussRole: analyst
  capabilities: [reasoning]
  think: true
  discussChannels:
    - proxmox
    - general
  triageSummary: "Reviews and reasons over Proxmox data the toolers gathered (computes and correlates VM, node, storage, and cluster facts) and answers conceptual Proxmox VE, qm/pct, ZFS, Ceph, HA, passthrough, and SDN questions. Relevant to any Proxmox-domain question."
  promptRefs: [discussion-protocol, response-style, proxmox-advisor-system, analyst-review-protocol]
  enabledTools: [artifact_head, artifact_tail, artifact_grep, artifact_count, artifact_rows, artifact_select, artifact_jq]
  discussKeywords:
    - proxmox
    - pve
    - pvesh
    - qm
    - pct
    - vzdump
    - pvesm
    - configure
    - setup
    - howto
    - command
    - cli
    - guide
    - tutorial
    - backup
    - restore
    - passthrough
    - ha
    - corosync
    - pcie
    - iommu
    - vfio
    - gpu
    - zfs
    - ceph
    - nfs
    - vlan
    - sdn
    - bridge
    - network
    - firewall
    - cluster
    - replication
    - template
    - cloudinit
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Analyst reasoner: gateway ON but enabledTools (spec) scopes it to exactly the
      # 7 artifact read-ops tools, so triage sees ONLY those, not the full 176-tool
      # catalog that made it CONTRIBUTE to everything. Those tools READ spilled-artifact
      # data under marker-only posting; they are NOT domain tools.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
      # Domain-strict triage: out-of-domain analysts stand aside (DRY via helper).
      - name: KUBEMOOT_DISCUSS_TRIAGE_PROMPT
        value: {{ include "homelab-pilot-crew.analystTriagePrompt" . | quote }}

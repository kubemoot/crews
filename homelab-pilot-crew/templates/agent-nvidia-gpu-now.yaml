apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: nvidia-gpu-now
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  # One question shape: "what is the GPU doing RIGHT NOW?"
  # Real-time scalars / instant vectors only. No time-series, no discovery,
  # no metric semantics. See agent.md → "Tooler Design — Cohesion,
  # Coupling, and Question Shape" for the rationale behind splitting the
  # original monolithic nvidia-gpu (which carried 5 tools across 4 question
  # shapes and took ~3 min per call).
  description: "Real-time NVIDIA GPU state — current utilization, temperature, VRAM use, power draw."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, observability]
  discussChannels:
    - observability
  triageSummary: "Answers 'what is GPU X doing right now?' — current utilization, temperature, VRAM use, power draw, clock speeds. NOT for historical trends, not for metric semantics, not for scrape-target health."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, nvidia-gpu-now-system]
  enabledTools: [execute_query]
  discussKeywords:
    - gpu
    - gpus
    - nvidia
    - cuda
    - dcgm
    - vram
    - temperature
    - rtx
    - utilization
    - "current"
    - "now"
  # LLM-based relevance: keyword overlap with the sibling -history and -meta
  # agents cannot tell the question shapes apart, so all three would claim
  # the same GPU question. LLM mode lets
  # the triage model read this triageSummary + the user message and
  # decide yes/no, so each shape claims only its own questions.
  discussRelevance:
    mode: llm
    promptHint: |
      DEFINE COMPONENT nvidia-gpu-now-relevance
      DESCRIPTION Triage rules for the real-time GPU state tooler

      WHEN the user asks for the CURRENT value of a GPU metric (utilization, temperature, VRAM use, power draw, clock speed) THEN say yes
      WHEN the user uses present-tense phrasing ("is it busy", "how hot is it", "right now", "current") about a GPU THEN say yes
      WHEN the user asks how a GPU metric CHANGED OVER A TIME WINDOW (trend, history, average over hour/day) THEN say no
      WHEN the user asks WHICH metrics or scrape targets EXIST (discovery, metadata, "what is available") THEN say no
      WHEN the question is not about GPU state THEN say no
  temperature: "0.3"
  maxTokens: 2048
  deployment:
    replicas: 1
    port: 8080

{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: nvidia-gpu-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "nvidia-gpu-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "nvidia-gpu-advisor") }}
  type: chat
  description: "Reviews and fact-checks the GPU findings against the stored results, the live GPU metrics and the NVIDIA GPU documentation, and asks the agent behind a doubtful finding to recheck it."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning, tool-calling]
  think: true
  discussChannels:
    - observability
    - general
  triageSummary: "Checks the GPU facts other agents reported (utilization, memory, temperature, power and clock readings) against the stored results, the live metrics and the NVIDIA GPU and DCGM documentation, says where a finding misreads what a GPU metric means, and asks the agent that reported a doubtful fact to recheck it. Adds no data of its own."
  promptRefs: [crew-invariants, advisor, nvidia-gpu-advisor-system]
  enabledTools: [{{ include "homelab-pilot-crew.advisorTools" (dict "root" $ "name" "nvidia-gpu-advisor" "live" (ternary (list "execute_query") list .Values.mcpServers.prometheus.enabled)) }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.advisors.workspaceQuery "tools" (list "workspace_query" "workspace_describe")) }}
  domains:
    - gpu
    - nvidia
    - cuda
    - dcgm
    - vram
  discussKeywords:
    - nvidia
    - gpu
    - gpus
    - cuda
    - dcgm
    - vram
    - driver
    - drivers
    - passthrough
    - iommu
    - vfio
    - pcie
    - tensorcore
    - mig
    - mps
    - rtx
    - ada-lovelace
    - blackwell
    - ampere
    - compute-capability
    - container-toolkit
    - device-plugin
    - architecture
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Gateway ON, scoped by enabledTools to the read and compute tools above.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
{{- end }}

{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: nvidia-gpu-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "nvidia-gpu-advisor") }}{{ include "homelab-pilot-crew.ragSources" (dict "root" $ "name" "nvidia-gpu-advisor") }}
  type: chat
  description: "Answers conceptual NVIDIA GPU and CUDA questions from documentation (RAG). Has NO live tools."
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "read") }}
  capabilities: [reasoning]
  think: true
  discussChannels:
    - observability
    - general
  triageSummary: "Reviews the GPU data other agents fetched (cross-checks utilization, VRAM, and temperature readings, correlates them) and answers conceptual NVIDIA GPU, CUDA, passthrough, and MIG questions from documentation. Fetches no live data."
  promptRefs: [discussion-protocol, response-style, nvidia-gpu-advisor-system, analyst-review-protocol]
  enabledTools: [workspace_head, workspace_tail, workspace_grep{{ if .Values.advisors.workspaceQuery }}, workspace_query{{ end }}{{ include "homelab-pilot-crew.ragSearchTools" (dict "root" $ "name" "nvidia-gpu-advisor") }}]
  discussKeywords:
    - nvidia
    - gpu
    - gpus
    - cuda
    - dcgm
    - vram
    - driver
    - drivers
    - passthrough
    - iommu
    - vfio
    - pcie
    - tensorcore
    - mig
    - mps
    - rtx
    - ada-lovelace
    - blackwell
    - ampere
    - compute-capability
    - container-toolkit
    - device-plugin
    - architecture
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Analyst reasoner: gateway ON but enabledTools (spec) scopes it to exactly the
      # workspace read tools, so triage sees ONLY those, not the full 176-tool
      # catalog that made it CONTRIBUTE to everything. Those tools READ the discussion workspace
      # data under marker-only posting; they are NOT domain tools.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
      # Domain-strict triage: out-of-domain analysts stand aside (DRY via helper).
      - name: KUBEMOOT_DISCUSS_TRIAGE_PROMPT
        value: {{ include "homelab-pilot-crew.analystTriagePrompt" . | quote }}
{{- end }}

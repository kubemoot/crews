{{- if include "homelab-pilot-crew.rbacTenant" . }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: compute
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "compute") }}
  type: chat
  description: "Computes exact counts, totals, means, orderings, top-N and unit conversions with code, over data other agents fetched or the question states; it fetches nothing, so select it with the agents that fetch the data."
  # Analyst role so it runs AFTER the toolers and receives their forwarded data,
  # but - unlike the reasoning-only analysts - it has ONE tool (execute_code) to
  # compute deterministically instead of tallying in its head.
  discussRole: analyst{{ include "homelab-pilot-crew.workspaceAccess" (dict "root" $ "access" "readWrite") }}
  think: {{ .Values.compute.think }}
  capabilities: [reasoning, tool-calling]
  discussChannels:
    - kubernetes
    - observability
    - general
  triageSummary: "Calculator for numbers other agents fetched: exact totals, sums, averages, percentages, unit conversions such as bytes to GiB, rounding, counts, sorts, top-N, group-by, dedup, min and max, for any domain. Works only on numbers stated in the question or stored in this discussion by the agents that fetched them. Its sandbox has no cluster API, no kubectl, no Prometheus, and no network, so a question about live data also needs the agents that fetch that data."
  promptRefs: [crew-invariants, compute-system]
  # execute_code/validate_code run the math. The workspace tools read the stored results of
  # the other agents server-side by key, so a key goes to the workspace server instead of
  # into open('/kubemoot/workspace/<key>') in sandbox code. The query tools need compute.workspaceQuery.
  enabledTools: [execute_code, validate_code, workspace_head, workspace_tail, workspace_grep{{ if .Values.compute.workspaceQuery }}, workspace_query, workspace_list, workspace_describe{{ end }}]{{ include "homelab-pilot-crew.workspaceDisabled" (dict "root" $ "on" .Values.compute.workspaceQuery "tools" (list "workspace_query" "workspace_list" "workspace_describe")) }}
  discussKeywords:
    - count
    - number
    - total
    - sum
    - average
    - percentage
    - percent
    - convert
    - round
    - sort
    - sorted
    - order
    - alphabetical
    - top
    - largest
    - smallest
    - most
    - fewest
    - tally
    - group
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Compute analyst: gateway ON (unlike the reasoning-only analysts, which run
      # gateway OFF) but scoped via enabledTools to exactly execute_code/validate_code,
      # so triage sees 1-2 tools, not the full catalog - the reason analysts were
      # tool-free does not apply at this scope.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
{{- end }}

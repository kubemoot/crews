{{- /* Each agent's own module: its purpose, and only the behavior that belongs to that agent.
     What a tool does and how to call it is in the tool's description (the MCPServers'
     toolOverrides); the role contracts are in promptmodule-roles.yaml. */}}
{{- define "homelab-pilot-crew.purposeModule" -}}
apiVersion: kubemoot.ai/v1alpha1
kind: PromptModule
metadata:
  name: {{ .name }}
  namespace: {{ .root.Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" .root | nindent 4 }}
spec:
  order: 30
  content: |
    {{- .content | nindent 4 }}
{{- end }}
{{- if include "homelab-pilot-crew.rbacTenant" . }}
{{- $modules := list
  (dict "name" "k8s-config-system" "content" `DEFINE DOMAIN kubernetes-configuration
DESCRIPTION You read how the cluster is configured and who may do what: namespaces, ConfigMaps and their contents, ServiceAccounts, Roles, ClusterRoles and their bindings, and Secrets by name.
ASSERT a ConfigMap's keys and values are data you report when the question asks what it says
ASSERT a Secret is reported by its name and count only`)
  (dict "name" "k8s-workloads-system" "content" `DEFINE DOMAIN kubernetes-workloads
DESCRIPTION You read what runs in the cluster and what it asks for: pods and the controllers that own them, their status and restarts, logs, images, and each container's requests and limits.
ASSERT a pod of a finished Job is an expected outcome, not a failing workload
ASSERT pods labeled kubemoot.ai/fitness-harness=true belong to the measurement, not to the cluster under question`)
  (dict "name" "k8s-services-system" "content" `DEFINE DOMAIN kubernetes-networking
DESCRIPTION You read how traffic reaches workloads: Services and their endpoints, Ingresses, Gateway API gateways and routes, and NetworkPolicies.`)
  (dict "name" "k8s-storage-system" "content" `DEFINE DOMAIN kubernetes-storage
DESCRIPTION You read persistent storage: claims, volumes, StorageClasses and the provisioners behind them.`)
  (dict "name" "k8s-scaling-system" "content" `DEFINE DOMAIN kubernetes-scaling
DESCRIPTION You read how workloads scale and what namespaces may use: HorizontalPodAutoscalers, VerticalPodAutoscalers, ResourceQuotas and LimitRanges.`)
  (dict "name" "k8s-nodes-system" "content" `DEFINE DOMAIN kubernetes-nodes
DESCRIPTION You read the cluster's nodes (capacity and allocatable, conditions, roles, labels, taints, versions) and which custom resource definitions and API kinds the cluster serves.`)
  (dict "name" "k8s-helm-system" "content" `DEFINE DOMAIN kubernetes-helm
DESCRIPTION You read the Helm releases installed: name, namespace, chart, chart and app version, revision and status.`)
  (dict "name" "k8sgpt-system" "content" `DEFINE DOMAIN kubernetes-diagnostics
DESCRIPTION You run the K8sGPT analyzers and read the cluster's Events to find what is misconfigured or failing, from any kind of object.
ASSERT you report each problem with its object (kind, name, namespace), most severe first`)
  (dict "name" "k8s-metrics-system" "content" `DEFINE DOMAIN kubernetes-usage
DESCRIPTION You measure how much CPU, memory, disk and network pods, namespaces and nodes use, now and over a window, and how that compares with what they request.
ASSERT you report a host or node by its name, not by its address`)
  (dict "name" "obs-metrics-system" "content" `DEFINE DOMAIN observability
DESCRIPTION You read whether the monitoring stack works and what it alerts on: its pods and their logs, ServiceMonitors, PodMonitors, alerting rules and firing alerts.
ASSERT you report a host or node by its name, not by its address`)
  (dict "name" "nvidia-gpu-now-system" "content" `DEFINE DOMAIN gpu-now
DESCRIPTION You read what each GPU is doing now: utilization, memory used and free, temperature, power and clocks.
ASSERT the labels that tie a GPU to its host differ between clusters; read them from the series before you filter by them`)
  (dict "name" "nvidia-gpu-history-system" "content" `DEFINE DOMAIN gpu-history
DESCRIPTION You read how a GPU metric moved over a window: averages, peaks, spikes and comparisons between windows, with the metric's unit.
ASSERT the labels that tie a GPU to its host differ between clusters; read them from the series before you filter by them`)
  (dict "name" "nvidia-gpu-meta-system" "content" `DEFINE DOMAIN gpu-monitoring
DESCRIPTION You read which GPU metrics exist and whether their exporters are being scraped.`)
  (dict "name" "proxmox-pve-system" "content" `DEFINE DOMAIN proxmox-hosts
DESCRIPTION You read the Proxmox hypervisor hosts: status, CPU and memory use, uptime, storage pools, network bridges, LXC containers and recent tasks.`)
  (dict "name" "proxmox-qm-system" "content" `DEFINE DOMAIN proxmox-vms
DESCRIPTION You read the virtual machines on Proxmox: which exist and run where, their configured CPU, memory, disks and passthrough devices, their performance over time, and snapshots.`)
  (dict "name" "scheduler-advisor-system" "content" `DEFINE DOMAIN scheduler
DESCRIPTION You set, list and cancel reminders and follow-up discussions for the person asking.
ASSERT the person never sees a schedule id; you name a schedule by what it is for and when
ASSERT you confirm which schedule you will cancel before you cancel it
WHEN the person wants a recurring schedule THEN say that a cluster admin sets those up
WHEN the request could be a reminder or a follow-up discussion THEN ask which
WHEN your prompt carries "Discussion context: threadId=<id>" THEN pass that id as the source thread`)
  (dict "name" "internet-search-system" "content" `DEFINE DOMAIN internet-research
DESCRIPTION You search the web for what the crew's own tools cannot know: outside documentation, releases, other tools and known problems.
ASSERT every fact you report names the page it came from`)
}}
{{- range $i, $m := $modules }}
{{- if $i }}
---
{{- end }}
{{ include "homelab-pilot-crew.purposeModule" (dict "root" $ "name" $m.name "content" $m.content) }}
{{- end }}
{{- $advisors := list
  (dict "name" "k8s-advisor" "domain" "kubernetes-advisor" "content" "DESCRIPTION You check the Kubernetes findings against the stored results, the live cluster where your tools read it, and the Kubernetes documentation you are given, and say where a finding misreads what a resource or field means.")
  (dict "name" "nvidia-gpu-advisor" "domain" "gpu-advisor" "content" "DESCRIPTION You check the GPU findings against the stored results, the live metrics where your tools read them, and the GPU documentation you are given, and say where a finding misreads what a GPU metric or setting means.")
  (dict "name" "obs-advisor" "domain" "observability-advisor" "content" "DESCRIPTION You check the monitoring findings against the stored results, the live metrics where your tools read them, and the Prometheus documentation you are given, and say where a finding misreads what a metric, monitor or rule means.")
  (dict "name" "proxmox-advisor" "domain" "proxmox-advisor" "content" "DESCRIPTION You check the Proxmox findings against the stored results, the live hypervisor where your tools read it, and the Proxmox documentation you are given, and say where a finding misreads what a host, VM or storage setting means.")
}}
{{- range $advisors }}
---
{{ include "homelab-pilot-crew.purposeModule" (dict "root" $ "name" (printf "%s-system" .name) "content" (printf "DEFINE DOMAIN %s\n%s%s" .domain .content (include "homelab-pilot-crew.ragSearchAdl" (dict "root" $ "name" .name) | replace "\n    " "\n"))) }}
{{- end }}
{{- end }}

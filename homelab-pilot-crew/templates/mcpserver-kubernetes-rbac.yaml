{{/* RBAC for the Kubernetes MCP servers.

Namespaced reads are not granted here. The Kubemoot operator binds its own read role in each
namespace that carries the label kubemoot.ai/crew-read=true, to the ServiceAccount of every
MCPServer with the kubernetes capability. Secret reads and write access are bound the same way
only in namespaces that also carry kubemoot.ai/crew-read-secrets or kubemoot.ai/crew-write, for
a server whose annotation kubemoot.ai/kubernetes-access asks for them (see
mcpserver-kubernetes.yaml). The operator also lets the account list namespaces.

What stays here is the cluster-scoped kinds a RoleBinding cannot grant, read-only, each one
because an agent reads it:
  nodes                    k8s-nodes (node capacity, conditions, kubelet version)
  persistentvolumes        k8s-storage (list and get PVs)
  storageclasses           k8s-storage (list and get StorageClasses)
  customresourcedefinitions  k8s-nodes (list and get CRDs)
  clusterroles, clusterrolebindings  k8s-config (list and get cluster RBAC objects)
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kubernetes-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-kubernetes-mcp
  apiGroup: rbac.authorization.k8s.io

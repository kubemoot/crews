{{- if .Values.mcpServers.codeSandbox.enabled }}
# A1 posture: lock the code-sandbox pod's EGRESS to NATS (+ DNS) only. The
# materializer sidecar needs NATS; the untrusted sandbox container shares this
# pod's network namespace, so this NetworkPolicy is the entire egress surface for
# BOTH containers - model-written code can reach NATS and nothing else (no
# internet, no API server). Cross-crew isolation (the sandbox could still reach
# other crews' NATS data since NATS has no auth) needs per-crew NATS accounts,
# which are not implemented yet. Ingress is untouched (the gateway still
# reaches the bridge).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-sandbox-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-sandbox-mcp
  policyTypes:
    - Egress
  egress:
    # NATS (the materializer sidecar fetches referenced objects).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.nats.namespace }}
      ports:
        - protocol: TCP
          port: 4222
    # DNS resolution for the NATS service name.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}

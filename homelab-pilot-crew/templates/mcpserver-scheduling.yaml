{{- if .Values.mcpServers.scheduling.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: scheduling-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  image: {{ include "homelab-pilot-crew.image" (dict "root" $ "image" .Values.mcpServers.scheduling.image) | quote }}
  transport: stdio
  command:
    - "/scheduling-mcp"
  port: 3000
  replicas: 1
  env:
    - name: KUBEMOOT_CREW
      value: {{ .Values.crew.name | quote }}
    - name: KUBEMOOT_NAMESPACE
      value: {{ .Release.Namespace | quote }}
    - name: NATS_URL
      value: "nats://nats.nats.svc.cluster.local:4222"
  capabilities:
    - scheduling
    - reminders
    - followups
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "200m"
      memory: "64Mi"
{{- end }}

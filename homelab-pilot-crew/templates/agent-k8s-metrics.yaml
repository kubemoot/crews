apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:{{ include "homelab-pilot-crew.egress" (dict "root" $ "kind" "agents" "name" "k8s-metrics") }}
  type: chat
  description: "Fetches live resource usage: how much CPU and memory each pod, namespace, and node is using now and over a time window, from the metrics API and Prometheus, including usage compared with requests."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes, observability]
  discussChannels:
    - kubernetes
  triageSummary: "Answers how much CPU, memory, disk, or network is being used right now or over a time window: top pods by memory or CPU, namespace totals, node utilization, usage trends, and usage against requests. Measures consumption with the metrics API and Prometheus instant and range queries."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-metrics-system]
  enabledTools: [pods_top, resources_list, resources_get, execute_query, execute_range_query, list_metrics]
  discussKeywords:
    - top
    - cpu
    - memory
    - usage
    - used
    - using
    - consumption
    - utilization
    - trend
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

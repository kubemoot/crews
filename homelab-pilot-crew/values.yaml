global:
  # Registry and namespace prefixed to the Kubemoot-built images below (artifact-access,
  # scheduling-mcp). Releases are published to GHCR; a private mirror sets its own
  # registry, e.g. harbor.example.com/kubemoot. Image values that already contain a "/"
  # are used as-is.
  imageRegistry: ghcr.io/kubemoot

crew:
  name: homelab-pilot
  description: AI-powered homelab infrastructure consultation crew
  discussion:
    enabled: true

# Baseline fitness-scenario CRs deployed alongside the crew.
# Default OFF: the operator starts a Job as soon as a CrewFitness exists, so
# deploying the baseline suite through the chart runs every scenario at once
# against the crew. Keep this off and run scenarios on demand (kmctl fitness
# run, or a CrewFitnessSuite).
fitness:
  deployBaselineScenarios: false

# Model CRs for this crew. Each entry becomes a Model in the crew namespace,
# labeled with capability / family / params / latencyClass so the
# CrewSchedulingPolicy rules can pick a model per phase by label.
#
# providerRef names a ModelProvider (an Ollama server) that the Kubemoot operator
# chart creates in its own namespace. The default below matches the provider the
# Kubemoot quickstart creates (ollama-local); change it to the name of yours.
#
# One model is enough: every phase falls back to it. For better answers, add a
# larger reasoning model (latencyClass: high, capabilities [tool-calling,
# reasoning]) and a medium tool-calling model; the policy then routes synthesis to
# the large model and tool work to the medium one. The maintainer's reference
# cluster runs qwen3 8B, 14B, and 32B on two GPUs.
models:
  - name: qwen3-8b
    model: "qwen3:8b"
    providerRef: ollama-local
    family: qwen3
    params: "8B"
    contextWindow: "32768"
    latencyClass: low
    vramMib: 5120
    capabilities: [tool-calling, reasoning]

# Embedding model configuration
embeddingModel:
  name: nomic-embed
  modelId: nomic-embed-text
  # ModelProvider that serves the embedding model (see models above).
  providerRef: ollama-local

# Vector store for RAG sources and the MCP gateway tool index. REQUIRED when
# ragSources.enabled is true: a pgvector (PostgreSQL) database this chart does not
# install. Set host, database, and existingSecret, the name of a Secret in the crew
# namespace holding the database credentials (keys: username, password). The chart
# does not create that Secret.
vectorStore:
  type: pgvector
  host: ""
  port: 5432
  database: kubemoot
  existingSecret: ""

# RAG sources configuration
ragSources:
  enabled: true
  sources:
    - name: kubectl-reference
      gitUrl: https://github.com/kubernetes/website
      branch: main
      collection: kubectl_reference
      paths:
        - "content/en/docs/reference/kubectl"

    - name: helm-reference
      gitUrl: https://github.com/helm/helm-www
      branch: main
      collection: helm_reference
      paths:
        - "docs"

    - name: talos-reference
      gitUrl: https://github.com/siderolabs/talos
      branch: main
      collection: talos_reference
      paths:
        - "website/content"

    - name: proxmox-api-reference
      gitUrl: https://github.com/0xlynett/proxmox-api-docs
      branch: main
      collection: proxmox_api_reference
      paths:
        - "."

    - name: proxmox-pve-docs
      gitUrl: https://github.com/proxmox/pve-docs
      branch: master
      collection: proxmox_pve_docs
      paths:
        - "."

    - name: kubernetes-concepts
      gitUrl: https://github.com/kubernetes/website
      branch: main
      collection: kubernetes_concepts
      paths:
        - "content/en/docs/concepts/services-networking"
        - "content/en/docs/concepts/workloads/pods"
        - "content/en/docs/concepts/workloads/controllers"
        - "content/en/docs/concepts/storage"
        - "content/en/docs/concepts/configuration"
        - "content/en/docs/concepts/cluster-administration"

    - name: kubernetes-mcp-tools
      gitUrl: https://github.com/containers/kubernetes-mcp-server
      branch: main
      collection: kubernetes_mcp_tools
      paths:
        - "."

    - name: nvidia-gpu-reference
      gitUrl: https://github.com/NVIDIA/cloud-native-docs
      branch: main
      collection: nvidia_gpu_reference
      paths:
        - "gpu-operator"
        - "gpu-telemetry"

    - name: prometheus-reference
      gitUrl: https://github.com/prometheus/docs
      branch: main
      collection: prometheus_reference
      paths:
        - "docs"

# MCP Gateway configuration
# Note: MCPServers are managed by Kubemoot, not by this chart.
# The Gateway discovers available MCPServers via its selector.
mcpGateway:
  # Enable to provide a unified gateway for all MCP servers
  enabled: true
  name: homelab-pilot-gateway
  # Valid implementations: kubemoot, contextforge, microsoft, docker
  # Note: 'kubemoot' uses the Kubemoot MCP Gateway with /admin/servers API for MCPServer registration
  implementation: kubemoot
  port: 8080
  replicas: 1
  # Select MCPServers to register with this gateway
  mcpServerSelector:
    matchLabels: {}  # Empty = select all MCPServers in namespace
  # Gateway requires ~608MB for JVM, set to 768Mi for headroom
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Tool index for semantic search
  toolIndex:
    # host, database, and secretRef default to the vectorStore values above.
    vectorStore:
      type: pgvector
      host: ""
      port: 5432
      database: ""
      secretRef: ""
    embeddingModel:
      provider: ollama
      # URL of an Ollama server that has the embedding model pulled.
      endpoint: http://ollama.ollama:11434
      model: nomic-embed-text
  # Meta-tools for agent discovery
  metaTools:
    enabled: true
    maxResultsPerSearch: 10
    # Dynamic tool discovery via Kubemoot's mcp-catalog-discovery agent
    # Disabled: auto-deploys community MCP servers that crash (wrong images, missing configs)
    discovery:
      enabled: false
      agentEndpoint: http://mcp-catalog-discovery.kubemoot:8080
  # Credential policies for dynamically provisioned MCPs
  credentialPolicies:
    - categories: ["kubernetes", "k8s"]
      serviceAccountName: homelab-pilot-kubernetes-mcp

# MCP Catalog for intelligent tool discovery
# Disabled: auto-deploys community MCP servers that crash (wrong images, missing configs)
mcpCatalog:
  enabled: false
  type: official-registry
  url: https://registry.modelcontextprotocol.io/v0/servers
  syncInterval: "24h"
  maxServers: 100
  queries:
    - kubernetes
    - infrastructure
    - devops
    - helm

# Quality policy for filtering discovered servers
mcpQualityPolicy:
  enabled: true
  allowing:
    - author: "Anthropic"
    - author: "kubernetes"
    - author: "modelcontextprotocol"
  blocking:
    - name:
        type: regex
        value: ".*feiskyer.*"
      reason: "Authentication bug - doesn't pass BearerToken auth"
    - name:
        type: regex
        value: ".*crypto.*"
      reason: "Not needed for homelab"
  considering:
    enabled: true
    confidenceThreshold: "0.7"
    timeoutSeconds: 30
    fallbackAction: deny

# Cluster permissions for the Kubernetes MCP servers (kubernetes, kubernetesLegacy,
# k8sgpt), which share one ServiceAccount. The default is read-only: cluster-wide
# get/list/watch through the built-in `view` ClusterRole plus the Flux, storage,
# networking, metrics, and Kubemoot resources the crew inspects. Agents act on
# text from tools and the web, so grant more only on a cluster you trust them with.
kubernetesAccess:
  # Adds get/list/watch on Secrets cluster-wide. helm_list needs it (Helm stores
  # release state in Secrets), and so does any question that counts Secrets.
  secretRead: false
  # Adds pods/exec, workload patch and scale, and the matching agent tools
  # (pods_exec, resources_scale, helm_install, helm_uninstall). When false the
  # MCP servers also run in their read-only modes.
  writeAccess: false

# NATS JetStream that carries the discussion and the artifact store. The Kubemoot
# quickstart and operator chart use release "nats" in namespace "nats".
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
  # Namespace of the NATS pods; the code-sandbox NetworkPolicy allows egress to it.
  namespace: nats

# Direct MCPServer deployment via Helm template
mcpServers:
  kubernetes:
    enabled: true
    # v0.0.58-0.63 return failed k8s API calls via the MCP isError flag (the agent
    # runtime already maps that to a failure signal); v0.0.57 returned them as
    # successful content, which got laundered into the discussion as fake data.
    image: "quay.io/containers/kubernetes_mcp_server:v0.0.63"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  kubernetesLegacy:
    enabled: true
    image: "mcp/kubernetes@sha256:0de7c3ea2dacf13bba03579a6911a899f8c213c8b86c7ca2bd216359efb79e3a"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    enabled: true
    # Prometheus HTTP API URL (a kube-prometheus-stack release in "monitoring" here).
    endpoint: "http://kube-prometheus-stack-prometheus.monitoring:9090"
  proxmox:
    # Proxmox VE tools for the proxmox-pve and proxmox-qm agents, which render only
    # when this is enabled. No public Proxmox MCP image ships with Kubemoot; set
    # image to your own and secretRef to a Secret with the Proxmox API credentials.
    enabled: false
    image: ""
    secretRef: proxmox-secret
  webSearch:
    # DuckDuckGo MCP server for internet-search (search, fetch_content). Docker's MCP
    # catalog publishes it only as latest, so it is pinned by digest.
    enabled: true
    image: "docker.io/mcp/duckduckgo@sha256:5617c4c60f48f47556c0735de7a73f6abd731c132c65ec8c720b511819c9f88f"
  k8sgpt:
    enabled: true
    image: "ghcr.io/k8sgpt-ai/k8sgpt:v0.4.26"
  scheduling:
    # Reminders and follow-ups (the scheduler-advisor agent renders only when this
    # is enabled). The scheduling-mcp image is not published to ghcr.io yet, so it
    # is off by default; enable it when your registry has the image.
    enabled: false
    image: scheduling-mcp:137268e5f2b4bc80f977d4d502cf124156d05d29
  codeSandbox:
    enabled: true
    # Kubemoot code-sandbox (kubemoot/code-sandbox): runs the compute tooler's
    # Python or bash with no stdin, a process-group time limit, and capped output.
    # The pod itself is the sandbox (no creds). The 0.0.0 tag is stamped at build with
    # Kubemoot's latest released code-sandbox version.
    image: "code-sandbox:0.0.0"
  artifactAccess:
    # Materializer sidecar for the code sandbox AND the read-ops server (one image,
    # two modes). The 0.0.0 tag is stamped at build with Kubemoot's latest released
    # artifact-access version.
    image: "artifact-access:0.0.0"
  artifactReadOps:
    # Shared read-ops MCP service (same artifact-access image, ARTIFACT_MODE=mcp):
    # network-capable agents call head/tail/grep/select/count/rows/jq over a
    # referenced artifact key to read a slice of the data where it is stored.
    enabled: true

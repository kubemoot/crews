global:
  # Registry and namespace prefixed to the Kubemoot-built images below (workspace-access,
  # scheduling-mcp). Releases are published to GHCR; a private mirror sets its own
  # registry, e.g. harbor.example.com/kubemoot. Image values that already contain a "/"
  # are used as-is.
  imageRegistry: ghcr.io/kubemoot

crew:
  name: homelab-pilot
  description: AI-powered homelab infrastructure consultation crew
  discussion:
    enabled: true
    # Who may ask this crew (Crew spec.discussion.access, kubemoot docs/concepts/who-is-asking.md).
    # Empty keeps today's behavior: anonymous callers are accepted. For example
    # {tokenReview: true, allowAnonymous: false} makes every caller send a Kubernetes token
    # with get on this Crew (the Homelab Pilot server sends its ServiceAccount token).
    access: {}
  # How Kubemoot places this crew's model calls: algorithm, learned (where each call
  # is predicted to finish soonest), or shadow (algorithm places; learned is logged
  # beside it). Empty inherits the cluster default (KubemootConfig).
  placementPolicy: ""

# Behavior rules every agent at the table follows in a discussion.
discussion:
  # peerVerification adds the peer-verification PromptModule to every agent that uses
  # discussion-protocol: an agent agrees with a peer's number or name only after checking
  # it against the stored result it came from. Off by default; switch it on for the B arm
  # of an A/B measurement.
  peerVerification:
    enabled: false

# Namespaces whose pods may reach this crew's discussion gateway when the operator
# generates network policies (Crew spec.network.allowedIngress). Each entry is a
# Kubernetes namespace label selector. Empty: only the crew's own namespace and the
# operator. Needs a Kubemoot operator that supports Crew network policies; leave it
# empty on an operator that does not.
network:
  allowedIngress: []

# Chat models: this chart ships none and names no model server for them. The cluster
# owner's model catalog supplies them (Model objects in the operator namespace
# plus the models each ModelServer reports), and the crew's
# CrewSchedulingPolicy (templates/crewschedulingpolicy.yaml) says what each
# phase needs. One chat model with tool-calling is enough; with a range of
# sizes, synthesis leans to the large model and tool work to medium.

# Embedding model configuration. The crew names the model and its vector size, never a
# server: stored vectors match only the model that made them, and the cluster's catalog
# supplies a ModelServer that has it. To pin the model to one ModelServer anyway
# (crew-local), set embeddingModel.serverRef.
embeddingModel:
  name: nomic-embed
  modelId: nomic-embed-text
  dimensions: 768

# Vector store for RAG sources and the MCP gateway tool index. REQUIRED when
# ragSources.enabled is true: a pgvector (PostgreSQL) database this chart does not
# install. Set host, database, and existingSecret, the name of a Secret in the crew
# namespace holding the database credentials (keys: username, password). The chart
# does not create that Secret.
vectorStore:
  type: pgvector
  host: ""
  port: 5432
  database: kubemoot
  existingSecret: ""

# RAG sources configuration. Each source is indexed once for the crew. A source's agents
# map names the agents that retrieve from it, keyed by the agent's rendered name; the value
# may set topK (chunks per question) and priority. An agent with no source listing it gets
# no spec.ragSources and retrieves nothing. kubernetes-mcp-tools lists no agent: it
# documents a tool server, not a question domain. ragSources.enabled=false renders no
# source and no binding.
# retrieval sets how bound agents get the text: preload (default) searches the source for
# every question and puts the top chunks into the prompt; tool leaves the source out of
# spec.ragSources and gives the agent a <source name>_search tool (needs a Kubemoot operator
# that registers it) to call when it needs the text. A binding's own retrieval overrides this
# value, for example agents: {k8s-advisor: {retrieval: tool}}. topK and priority are checked
# on every binding but used by preload only.
ragSources:
  enabled: true
  retrieval: preload
  sources:
    - name: kubectl-reference
      gitUrl: https://github.com/kubernetes/website
      branch: main
      collection: kubectl_reference
      paths:
        - "content/en/docs/reference/kubectl"
      agents:
        k8s-advisor: {topK: 2}

    - name: helm-reference
      gitUrl: https://github.com/helm/helm-www
      branch: main
      collection: helm_reference
      paths:
        - "docs"
      agents:
        k8s-advisor: {topK: 2}

    - name: talos-reference
      gitUrl: https://github.com/siderolabs/talos
      branch: main
      collection: talos_reference
      paths:
        - "website/content"
      agents:
        k8s-advisor: {topK: 2}

    - name: proxmox-api-reference
      gitUrl: https://github.com/0xlynett/proxmox-api-docs
      branch: main
      collection: proxmox_api_reference
      paths:
        - "."
      agents:
        proxmox-advisor: {topK: 2}

    - name: proxmox-pve-docs
      gitUrl: https://github.com/proxmox/pve-docs
      branch: master
      collection: proxmox_pve_docs
      paths:
        - "."
      agents:
        proxmox-advisor: {topK: 3}

    - name: kubernetes-concepts
      gitUrl: https://github.com/kubernetes/website
      branch: main
      collection: kubernetes_concepts
      paths:
        - "content/en/docs/concepts/services-networking"
        - "content/en/docs/concepts/workloads/pods"
        - "content/en/docs/concepts/workloads/controllers"
        - "content/en/docs/concepts/storage"
        - "content/en/docs/concepts/configuration"
        - "content/en/docs/concepts/cluster-administration"
      agents:
        k8s-advisor: {topK: 3}

    - name: kubernetes-mcp-tools
      gitUrl: https://github.com/containers/kubernetes-mcp-server
      branch: main
      collection: kubernetes_mcp_tools
      paths:
        - "."

    - name: nvidia-gpu-reference
      gitUrl: https://github.com/NVIDIA/cloud-native-docs
      branch: main
      collection: nvidia_gpu_reference
      paths:
        - "gpu-operator"
        - "gpu-telemetry"
      agents:
        nvidia-gpu-advisor: {topK: 3}

    - name: prometheus-reference
      gitUrl: https://github.com/prometheus/docs
      branch: main
      collection: prometheus_reference
      paths:
        - "docs"
      agents:
        obs-advisor: {topK: 3}

# MCP Gateway configuration
# Note: MCPServers are managed by Kubemoot, not by this chart.
# The Gateway discovers available MCPServers via its selector.
mcpGateway:
  # Enable to provide a unified gateway for all MCP servers
  enabled: true
  name: homelab-pilot-gateway
  # Valid implementations: kubemoot, contextforge, microsoft, docker
  # Note: 'kubemoot' uses the Kubemoot MCP Gateway with /admin/servers API for MCPServer registration
  implementation: kubemoot
  port: 8080
  replicas: 1
  # Select MCPServers to register with this gateway
  mcpServerSelector:
    matchLabels: {}  # Empty = select all MCPServers in namespace
  # Gateway requires ~608MB for JVM, set to 768Mi for headroom
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Tool index for semantic search
  toolIndex:
    # host, database, and secretRef default to the vectorStore values above.
    vectorStore:
      type: pgvector
      host: ""
      port: 5432
      database: ""
      secretRef: ""
    # EmbeddingModel resource the tool index embeds with. Defaults to this chart's
    # embeddingModel.name, so the index and the RAG sources share one resource.
    embeddingModelRef: ""
    embeddingModel:
      # The model only. The tool index reads the endpoint from the EmbeddingModel's
      # status, so the chart names no server; set endpoint here only to override.
      model: nomic-embed-text
  # Meta-tools for agent discovery
  metaTools:
    enabled: true
    maxResultsPerSearch: 10
    # Dynamic tool discovery via Kubemoot's mcp-catalog-discovery agent
    # Disabled: auto-deploys community MCP servers that crash (wrong images, missing configs)
    discovery:
      enabled: false
      agentEndpoint: http://mcp-catalog-discovery.kubemoot:8080
  # Credential policies for dynamically provisioned MCPs
  credentialPolicies:
    - categories: ["kubernetes", "k8s"]
      serviceAccountName: homelab-pilot-kubernetes-mcp

# MCP Catalog for intelligent tool discovery
# Disabled: auto-deploys community MCP servers that crash (wrong images, missing configs)
mcpCatalog:
  enabled: false
  type: official-registry
  url: https://registry.modelcontextprotocol.io/v0/servers
  syncInterval: "24h"
  maxServers: 100
  queries:
    - kubernetes
    - infrastructure
    - devops
    - helm

# Quality policy for filtering discovered servers
mcpQualityPolicy:
  enabled: true
  allowing:
    - author: "Anthropic"
    - author: "kubernetes"
    - author: "modelcontextprotocol"
  blocking:
    - name:
        type: regex
        value: ".*feiskyer.*"
      reason: "Authentication bug - doesn't pass BearerToken auth"
    - name:
        type: regex
        value: ".*crypto.*"
      reason: "Not needed for homelab"
  considering:
    enabled: true
    confidenceThreshold: "0.7"
    timeoutSeconds: 30
    fallbackAction: deny

# Fitness scenarios beyond the standard set. peerErrors renders the opt-in "peer-errors" tier:
# scenarios built to make one agent mislead the others (a planted wrong fact, conflicting
# sources, an oversized result, a plausible wrong answer, arithmetic), the test-fixture
# ConfigMaps they read (peer-errors-fixture-*, deliberately wrong data), and the ConfigMap
# <crew>-fitness-peer-errors that holds them. Off by default: test fixtures never reach a user's
# crew unless this is set. Run the tier with scripts/build-suite.py on fitness-peer-errors/.
fitness:
  peerErrors:
    enabled: false

# Which part of the chart one release renders, so an admin and a tenant can install the same
# chart from the same values. RBAC objects (ClusterRoles, ClusterRoleBindings, RoleBindings) need
# rights a namespaced applier, such as a Flux ServiceAccount that holds only its crew
# namespace, does not have.
#   all         everything (the default; install the chart once)
#   cluster     only the RBAC objects, for an admin to install
#   namespaced  everything else, for the tenant to install
# namePrefix is the release name of the "namespaced" release. Set it on the "cluster" release so
# its bindings name the ServiceAccounts that release creates. Leave it empty otherwise.
rbac:
  render: all
  namePrefix: ""

# Access for the Kubernetes MCP servers (kubernetes, kubernetesLegacy, which share one
# ServiceAccount) and k8sgpt (its own). This chart ships both accounts' roles and binds them, so
# the grant is in the chart's manifests: creating a binding in a namespace is the consent for
# it, and whoever installs the chart needs the right to create RoleBindings in the namespaces
# listed below. A listed namespace must exist when the chart is installed.
#
# Always cluster-wide, read-only: a small ClusterRole of the cluster-scoped kinds the agents
# read (namespaces, nodes, persistentvolumes, storageclasses, customresourcedefinitions,
# clusterroles, clusterrolebindings; k8sgpt adds ingressclasses, gatewayclasses and the webhook
# configurations), because a RoleBinding cannot grant them.
#
# Everything else is off until a namespace is listed. With namespaces empty and clusterWide
# false the servers read no namespace and every namespaced question fails as forbidden.
# Agents act on text from tools and the web, so grant more only on a cluster you trust them with.
kubernetesAccess:
  # Namespaces the servers may read: a RoleBinding to the read role in each (pods and logs,
  # workloads, services, ConfigMaps, events, volume claims, jobs, ingresses, network policies,
  # autoscalers, Flux releases and sources, Kubemoot resources, and ServiceAccounts, Roles and
  # RoleBindings; never Secrets).
  namespaces: []
  # true binds the read role cluster-wide with one ClusterRoleBinding instead, and ignores
  # namespaces for reads. Secret reads and write access are never cluster-wide.
  clusterWide: false
  # Secret reads: get/list/watch for the Kubernetes servers, get for k8sgpt, in the listed
  # namespaces only. helm_list needs it (Helm stores release state in Secrets; without it the
  # k8s-helm agent's calls fail as forbidden), and so does any question that counts Secrets.
  # Also list the namespace under namespaces, or the servers cannot read anything else there.
  secretRead:
    namespaces: []
  # pods/exec, workload patch and scale in the listed namespaces only, and the matching agent
  # tools (pods_exec, resources_scale, helm_install, helm_uninstall). While the list is empty
  # the MCP servers run in their read-only modes. exec and patch reach the namespace's Secrets
  # and ServiceAccount tokens. Also list the namespace under namespaces.
  write:
    namespaces: []

# NATS JetStream that carries the discussion and the workspace. The Kubemoot
# quickstart and operator chart use release "nats" in namespace "nats".
nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
  # Namespace of the NATS pods; the code-sandbox NetworkPolicy allows egress to it.
  namespace: nats

# Direct MCPServer deployment via Helm template
mcpServers:
  kubernetes:
    enabled: true
    # containers/kubernetes-mcp-server v0.1.1, pinned by digest. It reports a failed
    # Kubernetes API call with the MCP isError flag, which the agent runtime maps to a
    # failure signal, and its list tools take limit and continue. It reads its settings
    # from a TOML file only, which the chart renders (templates/mcpserver-kubernetes.yaml),
    # so another version may need a different file.
    image: "quay.io/containers/kubernetes_mcp_server@sha256:d616331a99184d42f7471eac5ae257192e7065bb684ad115cc95c2e76cfbc2d1"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  kubernetesLegacy:
    enabled: true
    image: "mcp/kubernetes@sha256:0de7c3ea2dacf13bba03579a6911a899f8c213c8b86c7ca2bd216359efb79e3a"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  prometheus:
    enabled: true
    # Prometheus HTTP API URL (a kube-prometheus-stack release in "monitoring" here).
    endpoint: "http://kube-prometheus-stack-prometheus.monitoring:9090"
  proxmox:
    # Proxmox VE tools for the proxmox-pve and proxmox-qm agents, which render only
    # when this is enabled. Kubemoot ships no Proxmox MCP image, so image stays empty
    # and the chart requires yours. The recommended one is akmalovaa/proxmox-mcp (MIT,
    # multi-arch, Streamable HTTP): ghcr.io/akmalovaa/proxmox-mcp, pinned by digest
    # rather than by tag, for example
    #   ghcr.io/akmalovaa/proxmox-mcp@sha256:c14fe296fc49d40ae1ac72578f06939a9ea89baec77e21c9e3ead03b96b9323f
    # (the 2.3.0 release). The chart starts it at the read risk level with only the
    # tools the two agents use. Another server needs its own tool names in the agents.
    enabled: false
    image: ""
    # A Secret in the crew namespace whose keys are the server's environment variables:
    # PROXMOX_HOST (host or IP, no scheme), PROXMOX_USER (for example mcp@pve),
    # PROXMOX_TOKEN_NAME and PROXMOX_TOKEN_VALUE. Give the token a read-only role such as
    # PVEAuditor.
    secretRef: proxmox-secret
    # Check the Proxmox certificate. Leave true unless the nodes serve a self-signed one.
    verifySsl: true
  webSearch:
    # DuckDuckGo MCP server for internet-search (search, fetch_content). Docker's MCP
    # catalog publishes it only as latest, so it is pinned by digest.
    enabled: true
    image: "docker.io/mcp/duckduckgo@sha256:5617c4c60f48f47556c0735de7a73f6abd731c132c65ec8c720b511819c9f88f"
  k8sgpt:
    enabled: true
    image: "ghcr.io/k8sgpt-ai/k8sgpt:v0.4.26"
  scheduling:
    # Reminders and follow-ups (the scheduler-advisor agent renders only when this
    # is enabled). Off by default. The 0.0.0 tag is stamped at build with Kubemoot's
    # latest released scheduling-mcp version.
    enabled: false
    image: "scheduling-mcp:0.0.0"
  codeSandbox:
    enabled: true
    # Kubemoot code-sandbox (kubemoot/code-sandbox): runs the compute tooler's
    # Python or bash with no stdin, a process-group time limit, and capped output.
    # The pod itself is the sandbox (no creds). The 0.0.0 tag is stamped at build with
    # Kubemoot's latest released code-sandbox version.
    image: "code-sandbox:0.0.0"
    # The RuntimeClass to run the code sandbox pod under, for example gvisor. Empty runs it
    # under the cluster's default runtime. Needs a Kubemoot operator that supports MCPServer
    # runtime classes and the runtime installed on the nodes.
    runtimeClassName: ""
    # How the gateway reaches the code sandbox: stdio (through the operator's bridge
    # sidecar) or http (the sandbox serves MCP over Streamable HTTP itself, with no
    # bridge). http needs a code-sandbox image that supports it (a Kubemoot release with
    # Streamable HTTP in the code sandbox) and is required under a sandboxed runtime
    # such as gvisor, where the bridge's FIFOs are not shared between containers.
    transport: stdio
  workspace:
    # The workspace-access MCP server (reads slices of the discussion workspace) and the
    # materializer sidecar of the code sandbox. The server takes its image from the operator
    # (kubemootImage: workspaceAccess); image below is the sidecar's only. The 0.0.0 tag is
    # stamped at build with Kubemoot's latest released workspace-access version. The old
    # mcpServers.artifactAccess.image and mcpServers.artifactReadOps.enabled values still
    # apply for one release.
    enabled: true
    # A workspace_query may grow the process by queryMemory and two run at once; the limit holds the
    # process, two queries and a margin. A query over queryMemory stops with an error instead of the
    # container being killed.
    queryMemory: "128MB"
    # When true, the query error that names a column a table lacks also says how to read a field
    # inside a column that holds a nested object (status.conditions for the column status) with
    # the SQL that does it. Off by default; needs a workspace-access image that reads
    # KUBEMOOT_QUERY_NESTED_HINTS.
    nestedColumnHints: false
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        memory: "512Mi"
    image: "workspace-access:0.0.0"

# Outbound network access per workload. Each map is keyed by the rendered name of an
# MCPServer (mcpServers) or an Agent (agents); the value is copied verbatim into that
# resource's spec.egress, so a field the operator adds later needs no chart change.
# Empty renders no spec.egress, which is what a Kubemoot without egress policies needs.
# Example: egress.mcpServers.search-mcp.allowedHosts=[api.example.com], ports=[443].
# Needs a Kubemoot operator with egress policies and security.networkPolicies.egress.mode:
# Declared on the operator chart; see the README.
# agentsDefault, when set (an empty map {} included), becomes spec.egress on every Agent
# that has no entry of its own under agents; a named agents entry replaces it entirely.
# MCP servers never take it. {} limits agents to the operator's automatic allows.
egress:
  # agentsDefault: {}
  mcpServers: {}
  agents: {}

# The discussion workspace: the scratch data the agents of one discussion share (large tool
# results stored by key). declareAccess puts Agent.spec.workspace.access on each agent:
# write on the tools-only agents (they store results and read none), read on the analysts
# (advisors), readWrite on compute. The coordinator declares nothing. false renders no
# workspace field and no disabledTools, for an operator whose Agent CRD has no spec.workspace
# (the agents still list the new tool names, so the workspace server must serve
# workspace_head, workspace_tail and workspace_grep); the agents then behave as they did before
# access was declared. The analysts on read store none of their own tool results, which come
# back inline and may be cut. A false query switch below renders disabledTools, because the
# declared access grants every workspace tool it allows.
workspace:
  declareAccess: true

# The compute agent. workspaceQuery adds the workspace tools to its tools: workspace_query
# (read-only SQL over the discussion's stored results), workspace_list (what the discussion
# has stored) and workspace_describe (each stored table's columns, types and examples). The
# workspace server offers the query tools only when the operator setting
# workspace.queryEngine is sqlite or duckdb; with it off, the agent registers only the tools
# its gateway offers, so the tool is simply absent. The compute agent always has
# workspace_head, workspace_tail and workspace_grep.
#
# think: whether the compute agent's model reasons before it answers. true is how the agent has
# always run; false leaves out the reasoning, which is a model call that costs seconds on a
# prompt of several thousand tokens, and is here so a measurement can compare the two on their own.
#
# groundNumbers: when true, a figure in compute's finding that occurs in no result a tool returned
# to it and not in its input is sent back once and then withheld (the finding becomes a NO_DATA
# statement that reports no figure), so compute never reports a value it did not compute. Off by
# default; needs a Kubemoot agent-runtime that reads KUBEMOOT_DISCUSS_COMPUTE_GROUNDING.
compute:
  workspaceQuery: true
  think: true
  groundNumbers: false

# The advisors (k8s, nvidia-gpu, obs, proxmox). workspaceQuery adds workspace_query to their
# tools, beside workspace_head, workspace_tail and workspace_grep, with the same operator
# requirement as compute.workspaceQuery.
advisors:
  workspaceQuery: true

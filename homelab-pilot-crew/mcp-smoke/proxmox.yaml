# Smoke tests for the proxmox MCP server.
# Catches the kind of outage we hit in the Proxmox MCP Missing Secret incident:
# the server pod was unable to start because the proxmox-secret was missing.
# This smoke would have failed immediately rather than the issue being surfaced
# only when a user asked a Proxmox question through the crew.

server: proxmox-mcp
namespace: crew-homelab-pilot
description: Proxmox API tools via the proxmox MCP server

# Most tool names below are placeholders — populate by running `tools/list`
# against the live server once and pasting the actual tool names.
tools:
  - name: get_nodes
    invoke: true
    input: {}
    assert:
      - kind: not_error
      # At least one Proxmox node name should appear; pve is the default node
      # used elsewhere in the IaC. Adjust if your Proxmox cluster uses different
      # node names.
      - kind: response_contains
        value: pve

  - name: get_vms
    invoke: true
    input:
      node: pve
    assert:
      - kind: not_error

  - name: get_storage
    invoke: true
    input:
      node: pve
    assert:
      - kind: not_error

  # Destructive tools — verify registration only, never invoke
  - name: shutdown_vm
    invoke: false
    assert:
      - kind: listed_in_tools

  - name: start_vm
    invoke: false
    assert:
      - kind: listed_in_tools

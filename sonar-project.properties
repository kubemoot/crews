sonar.projectKey=crews
sonar.projectName=Kubemoot crews
# The crew charts (Kubernetes and Helm rules apply to the templates), the fitness
# suite builder in scripts/, the release scripts in .github/scripts/, and the O'guide
# search server in Go.
sonar.sources=homelab-pilot-crew,kubemoot-fitness-crew,scripts,.github,oguide-crew/search-server-go
sonar.tests=scripts,.github/scripts,oguide-crew/search-server-go
sonar.test.inclusions=scripts/test_*.py,.github/scripts/test-*.sh,oguide-crew/search-server-go/**/*_test.go
# Fitness scenarios are prompt text, not code.
# Measurement reports are local output and never committed.
sonar.exclusions=scripts/test_*.py,.github/scripts/test-*.sh,**/fitness/*.adl,**/fitness/*.md,**/reports/**,oguide-crew/search-server-go/**/*_test.go
sonar.python.version=3
sonar.python.coverage.reportPaths=coverage.xml
sonar.go.coverage.reportPaths=oguide-crew/search-server-go/coverage.out
sonar.sourceEncoding=UTF-8

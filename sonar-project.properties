sonar.projectKey=crews
sonar.projectName=Kubemoot crews
# The crew charts (Kubernetes and Helm rules apply to the templates), the fitness
# suite builder in scripts/, and the release scripts in .github/scripts/.
sonar.sources=homelab-pilot-crew,kubemoot-fitness-crew,scripts,.github
sonar.tests=scripts,.github/scripts
sonar.test.inclusions=scripts/test_*.py,.github/scripts/test-*.sh
# Fitness scenarios are prompt text, not code.
# Measurement reports are local output and never committed.
sonar.exclusions=scripts/test_*.py,.github/scripts/test-*.sh,**/fitness/*.adl,**/fitness/*.md,**/reports/**
sonar.python.version=3
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

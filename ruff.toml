# Ruff settings for the Python in this repository (scripts/). CI Release Scripts runs
# `ruff check .` at the pin in scripts/requirements-lint.txt.
# Ruff defaults plus bugbear, pycodestyle, and the cyclomatic complexity gate (<= 10).
line-length = 120

[lint]
extend-select = ["B", "C90", "E", "W"]

[lint.mccabe]
max-complexity = 10

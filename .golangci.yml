# One golangci-lint configuration for every Go module in this repository, the same linters
# and limits as kubemoot/kubemoot (cyclomatic complexity at most 10). golangci-lint looks for
# its config in the working directory and then in each parent, so a run from any module
# directory picks up this file. CI runs it in each module's test job.
version: "2"
run:
  allow-parallel-runners: true
  relative-path-mode: cfg
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      # Ecosystem cyclomatic complexity gate: CC <= 10.
      min-complexity: 10
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      # Table-driven tests repeat fixtures and run long by design.
      - linters:
          - dupl
          - goconst
          - lll
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

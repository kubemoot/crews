    - Disk usage: `execute_query(query="(1 - node_filesystem_avail_bytes{mountpoint='/'} / node_filesystem_size_bytes{mountpoint='/'}) * 100")`
    - Pod CPU by namespace: `execute_query(query="sum(rate(container_cpu_usage_seconds_total{namespace!=''}[5m])) by (namespace)")`
    - Pod memory by namespace: `execute_query(query="sum(container_memory_working_set_bytes{namespace!=''}) by (namespace)")`
    - Historical trends: `execute_range_query`; discover available metrics: `list_metrics`

    ## Your domain

    Monitoring-stack health (are the Prometheus / Grafana / Alertmanager pods running?);

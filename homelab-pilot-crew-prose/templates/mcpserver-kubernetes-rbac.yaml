{{/* RBAC for kubernetes MCP servers - needed for both static and dynamic discovery */}}
{{/* The credentialPolicies reference this service account for dynamically provisioned k8s MCPs */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
rules:
  # Read-only access to core resources. Secrets are listed only when
  # kubernetesAccess.secretRead is true (see values.yaml).
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes", "namespaces", "configmaps",{{ if .Values.kubernetesAccess.secretRead }} "secrets",{{ end }} "events", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  {{- if .Values.kubernetesAccess.writeAccess }}
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  {{- end }}
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # API discovery for resources_list
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.kubernetesAccess.writeAccess }}
  # Scale and patch for workload management (kubectl_scale, kubectl_patch)
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/rollout"]
    verbs: ["get", "patch"]
  {{- end }}
  # Flux HelmRelease CRDs (for helm tooler queries)
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["helmrepositories", "helmcharts", "ocirepositories"]
    verbs: ["get", "list", "watch"]
  # Storage resources (StorageClasses are cluster-scoped)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # Autoscaling resources
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  # Kubemoot CRDs (for cluster introspection)
  - apiGroups: ["kubemoot.ai"]
    resources: ["agents", "mcpservers", "mcpgateways", "ragsources", "models", "modelproviders"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kubernetes-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-kubernetes-mcp
  apiGroup: rbac.authorization.k8s.io
---
# Broad read-only coverage via the built-in `view` role, so the crew can answer about
# any standard resource class (networkpolicies, resourcequotas, PDBs, RBAC, etc.) without
# enumerating each one above. `view` excludes secrets; the custom role above adds CRD
# access, plus secrets, exec, and patch only when kubernetesAccess opts in to them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kubernetes-mcp-view
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kubernetes-mcp
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io

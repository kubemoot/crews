apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: nvidia-gpu-history
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot-prose
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  # One question shape: "how has the GPU's behavior CHANGED OVER TIME?"
  # Time-series, trends, spikes, regressions. May need metric-metadata to
  # explain units/semantics in the answer. NOT for real-time state and not
  # for discovery of available metrics.
  description: "GPU trend / time-series analysis — how a metric moved over a window, plus the metric semantics needed to discuss it."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, observability]
  discussChannels:
    - observability
  triageSummary: "Answers 'how did GPU X trend over time?' — usage spikes, average over an hour, comparison across windows. Includes metric metadata when explaining units. NOT for current state, NOT for scrape-target health."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, nvidia-gpu-history-system]
  enabledTools: [execute_range_query, get_metric_metadata]
  discussKeywords:
    - gpu
    - trend
    - history
    - over
    - last
    - hour
    - day
    - week
    - average
    - spike
    - peak
    - decline
    - regression
  # LLM-based relevance — see sibling -now agent for rationale. The
  # promptHint here biases yes toward time-series / window-spanning
  # questions and no toward current-state / discovery shapes.
  discussRelevance:
    mode: llm
    promptHint: |
      This tooler answers about how a GPU metric changed over a time window. It's relevant when someone asks for a trend, history, the last hour/day/week, an average, a spike or peak, a decline, a comparison, or a regression — or uses time-spanning phrasing like "over the last", "during", "did it get worse". It's not the right one when the question is about the current instant value ("right now", "current" — that's the real-time tooler), about which metrics or scrape targets exist (the discovery tooler), or anything that isn't a time-spanning GPU metric.
  temperature: "0.3"
  maxTokens: 2048
  deployment:
    replicas: 1
    port: 8080

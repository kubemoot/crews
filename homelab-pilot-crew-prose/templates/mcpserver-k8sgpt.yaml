{{- if .Values.mcpServers.k8sgpt.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: k8sgpt-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  image: {{ .Values.mcpServers.k8sgpt.image }}
  transport: stdio
  command:
    - "/k8sgpt"
    - "serve"
    - "--mcp"
    - "--port"
    - "3000"
    - "--metrics-port"
    - "3001"
  port: 3000
  replicas: 1
  serviceAccountName: {{ .Release.Name }}-kubernetes-mcp
  env:
    - name: K8SGPT_BACKEND
      value: "noopai"
    - name: K8SGPT_PASSWORD
      value: "none"
    - name: K8SGPT_MODEL
      value: "none"
  capabilities:
    - kubernetes
    - analysis
    - troubleshooting
    - diagnostics
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
{{- end }}

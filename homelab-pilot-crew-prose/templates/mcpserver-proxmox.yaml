{{- if .Values.mcpServers.proxmox.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPServer
metadata:
  name: proxmox-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  image: {{ include "homelab-pilot-crew.image" (dict "root" $ "image" .Values.mcpServers.proxmox.image) | quote }}
  transport: stdio
  command:
    - "proxmox-mcp"
  port: 3000
  replicas: 1
  secretRef: {{ .Values.mcpServers.proxmox.secretRef }}
  capabilities:
    - proxmox
    - hypervisor
    - virtual-machines
    - lxc-containers
    - storage
    - backup
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
{{- end }}

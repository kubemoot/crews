apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot-prose
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Queries Kubernetes resource metrics via Prometheus: CPU, memory, pod resource usage."
  discussRole: tooler
  think: false
  capabilities: [tool-calling, kubernetes, observability]
  discussChannels:
    - kubernetes
  triageSummary: "Measures pod and node CPU, memory, disk, and network consumption via pods_top, execute_query, execute_range_query, and list_metrics tools. Runs PromQL against Prometheus."
  promptRefs: [discussion-protocol, response-style, tooler-discipline, k8s-metrics-system]
  enabledTools: [pods_top, resources_list, resources_get, execute_query, execute_range_query, list_metrics]
  discussKeywords:
    - top
    - cpu
    - memory
    - resource
    - usage
    - consumption
    - request
    - requests
    - limit
    - limits
    - capacity
    - utilization
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080

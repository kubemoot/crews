apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: k8s-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: homelab-pilot-prose
    kubemoot.ai/role: analyst
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Answers conceptual Kubernetes questions from documentation (RAG). Has NO live cluster tools."
  discussRole: analyst
  capabilities: [reasoning]
  think: true
  discussChannels:
    - kubernetes
    - general
  triageSummary: "Reviews and reasons over Kubernetes data the toolers gathered (computes totals/percentages, enumerates resources, correlates facts) and answers conceptual Kubernetes, Talos, Helm, RBAC, and networking questions. Relevant to any Kubernetes-domain question."
  promptRefs: [discussion-protocol, response-style, k8s-advisor-system, analyst-review-protocol]
  enabledTools: [artifact_head, artifact_tail, artifact_grep, artifact_count, artifact_rows, artifact_select, artifact_jq]
  discussKeywords:
    - concept
    - explain
    - difference
    - compare
    - best-practice
    - bestpractice
    - pattern
    - architecture
    - recommend
    - recommendation
    - troubleshoot
    - debug
    - tutorial
    - kubernetes
    - k8s
    - helm
    - talos
    - rbac
    - operator
  temperature: "0.3"
  maxTokens: 4096
  deployment:
    replicas: 1
    port: 8080
    env:
      # Analyst reasoner: gateway ON but enabledTools (spec) scopes it to exactly the
      # 7 artifact read-ops tools, so triage sees ONLY those, not the full 176-tool
      # catalog that made it CONTRIBUTE to everything. Those tools READ spilled-artifact
      # data under marker-only posting; they are NOT domain tools.
      - name: KUBEMOOT_GATEWAY_ENABLED
        value: "true"
      # Domain-strict triage: out-of-domain analysts stand aside (DRY via helper).
      - name: KUBEMOOT_DISCUSS_TRIAGE_PROMPT
        value: {{ include "homelab-pilot-crew.analystTriagePrompt" . | quote }}

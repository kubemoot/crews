{{- if .Values.mcpServers.scheduling.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: Agent
metadata:
  name: scheduler-advisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
    kubemoot.ai/crew: {{ .Values.crew.name }}
    kubemoot.ai/role: tooler
  annotations:
    kubemoot.ai/discuss-priority: medium
    kubemoot.ai/scale-to-zero: "true"
spec:
  type: chat
  description: "Manages scheduled reminders and follow-up discussions via the scheduling-mcp tools."
  discussRole: tooler
  think: false
  capabilities: [tool-calling]
  discussChannels:
    - general
    - scheduler
  triageSummary: "Handles scheduling requests: reminders ('remind me in 30 minutes'), follow-up discussions ('re-check disk usage tomorrow at 9am'), listing pending schedules, and cancellation."
  # Temporal phrasing is unbounded — "in three minutes", "at the end of
  # the day", "every Monday for a month", "give it a few minutes then
  # re-look". Keyword-list matching cannot keep up. LLM mode asks the
  # triage model whether the user message looks like a scheduling
  # request, with the promptHint biasing toward temporal intent.
  discussRelevance:
    mode: llm
    promptHint: |
      Say yes if the user wants something done at a future time, after a
      delay, on a recurring cadence, or wants to re-do an earlier step
      later. Say yes for phrases like "remind me", "later", "in a few
      minutes", "at noon", "every Monday", "follow up", "re-check",
      "ping me when". Say no when the user just wants an immediate
      answer with no temporal component.
  promptRefs: [discussion-protocol, response-style, scheduler-advisor-system]
  discussKeywords:
    - remind
    - reminder
    - schedule
    - scheduled
    - follow-up
    - followup
    - later
    - tomorrow
    - tonight
    - monday
    - tuesday
    - wednesday
    - thursday
    - friday
    - saturday
    - sunday
    - daily
    - weekly
    - "in 30"
    - "in an hour"
    - "in 1 hour"
    - "in 2 hours"
    - "in 10 minutes"
    - cancel
    - cancel reminder
    - delete reminder
    - re-ask
    - reask
    - check again
    - recheck
  enabledTools:
    - set_reminder
    - schedule_followup
    - list_scheduled
    - cancel_scheduled
  temperature: "0.3"
  maxTokens: 2048
  deployment:
    replicas: 1
    port: 8080
{{- end }}

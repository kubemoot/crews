{{- if .Values.mcpCatalog.enabled }}
apiVersion: kubemoot.ai/v1alpha1
kind: MCPCatalog
metadata:
  name: {{ .Release.Name }}-catalog
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpCatalog.type | default "official-registry" }}
  url: {{ .Values.mcpCatalog.url | default "https://registry.modelcontextprotocol.io/v0/servers" }}
  syncInterval: {{ .Values.mcpCatalog.syncInterval | default "24h" | quote }}
  maxServers: {{ .Values.mcpCatalog.maxServers | default 100 }}
  {{- if .Values.mcpCatalog.queries }}
  queries:
    {{- toYaml .Values.mcpCatalog.queries | nindent 4 }}
  {{- end }}
  qualityPolicyRef: {{ .Release.Name }}-quality-policy
{{- end }}

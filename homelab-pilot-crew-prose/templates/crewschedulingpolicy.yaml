{{/*
CrewSchedulingPolicy for the homelab-pilot crew.

Declares per-phase Model selection rules. Agents in this crew get their
(model, provider) for each phase by matching against these rules.

The mulling and triage rules omit the explicit `prefer` block: with
`qualityBias` set below, the scheduler auto-derives per-Model weights from
each agent's declared spec.capabilities. The agent's most demanding
capability sets the bias (max combiner). Loose coupling preserved — no
Agent CR names a model size; the scheduler matches at reconcile time.

See the Kubemoot scheduler documentation, section "Quality bias", for the
design and worked-example bindings.
*/}}
apiVersion: kubemoot.ai/v1alpha1
kind: CrewSchedulingPolicy
metadata:
  name: {{ .Values.crew.name }}-scheduling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homelab-pilot-crew.labels" . | nindent 4 }}
spec:
  crewRef: {{ .Values.crew.name | quote }}
  archetypeRef: consent-3
  # Per-capability quality bias. Each scalar in [0.0, 1.0]: low → speed-lean
  # (latencyClass:low, qwen3:8b), high → quality-lean (latencyClass:high,
  # qwen3:32b), and the MIDDLE band (~0.33-0.67) now lands on the medium tier
  # (qwen3:14b) via the scheduler's tent curve - medium peaks at bias 0.5. The
  # agent's effectiveBias = max(qualityBias[c] for c in agent.spec.capabilities),
  # falling back to qualityBias.default when none match. Strings — the CRD
  # field is map[string]string to dodge the OpenAPI float-precision foot-gun.
  qualityBias:
    reasoning: "0.7"        # synthesis / multi-step reasoning → push quality (32B)
    tool-calling: "0.5"     # land toolers on the 14B medium tier: the 8B mis-formulates resource queries and under-reports; 0.5 is the tent apex, medium is the strict win
    observability: "0.4"    # slight quality nudge → also reaches the 14B medium tier
    kubernetes: "0.4"
    default: "0.4"          # for capabilities not listed above
  rules:
    - phase: mulling
      require:
        matchLabels:
          capability/tool-calling: "true"
      # No prefer block — auto-derived from qualityBias above. To override
      # the auto-derivation for an edge-case crew, re-add an explicit prefer
      # list here and it will take precedence for this rule.
    - phase: triage
      require:
        matchLabels:
          capability/tool-calling: "true"
      # Triage is one LLM call by the coordinator (per
      # kubemoot/docs/agentic-consensus.md "Triage Subcommittee Selection") — a
      # classification task, not reasoning. Pin it to a fast (latencyClass:low)
      # Model with an explicit prefer block so it does NOT inherit the
      # coordinator's reasoning bias via qualityBias auto-derivation. Explicit
      # prefer wins (scheduler.md "Override semantics"). The advisory call shares
      # this triage model (agent-runtime DiscussionOrchestrator.runAdvisoryPhase);
      # only synthesis stays on the reasoning tier.
      prefer:
        - weight: 100
          selector:
            matchLabels:
              latencyClass: low

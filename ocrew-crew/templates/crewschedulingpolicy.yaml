{{/*
CrewSchedulingPolicy for O'crew.

The crew ships no Model objects and names no model server. The cluster owner's model
catalog supplies the models (Model objects in the operator namespace plus the models
each ModelServer reports), and the scheduler matches these per-phase rules against the
catalog's labels. No Agent names a model or a size.

See the Kubemoot scheduler documentation, sections "Quality bias", "Selecting from the
model catalog", and "Preferring the faster model".
*/}}
apiVersion: kubemoot.ai/v1alpha1
kind: CrewSchedulingPolicy
metadata:
  name: {{ .Values.crew.name }}-scheduling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocrew-crew.labels" . | nindent 4 }}
spec:
  crewRef: {{ .Values.crew.name | quote }}
  archetypeRef: consent-3
  {{- with .Values.crew.placementPolicy }}
  placementPolicy: {{ . | quote }}
  {{- end }}
  # An agent's effective bias is the max of qualityBias[c] over its declared
  # capabilities. The coordinator and the curator declare reasoning and lean to the
  # large model; the two search agents declare only tool-calling and land on medium.
  # Strings, because the CRD field is map[string]string.
  qualityBias:
    reasoning: "0.7"
    tool-calling: "0.5"
    default: "0.5"
  rules:
    - phase: mulling
      require:
        matchLabels:
          capability/tool-calling: "true"
      # No prefer list and no preferFaster, so each agent's score comes from qualityBias.
    - phase: triage
      require:
        matchLabels:
          capability/tool-calling: "true"
      # Triage and the advisory call are short classification calls: measured speed
      # ranks the candidates, so the coordinator's reasoning bias does not pull them
      # to the large model.
      preferFaster: 50

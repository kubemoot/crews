crew:
  name: kubemoot-fitness
  description: Internal Kubemoot crew that scores fitness results against ground truth (REFLECTS judge)
  # The DEFER fitness keyword this crew evaluates. A scenario assertion
  # `DEFER synthesis REFLECTS "<ref>"` is resolved to this crew via the
  # kubemoot.ai/adl-keyword label. Change this (and the judge prompt) to serve a
  # different keyword.
  adlKeyword: REFLECTS
  discussion:
    enabled: true

# The judge's Model CRs. providerRef names a ModelProvider (an Ollama server) that
# the Kubemoot operator chart creates in its own namespace; the default matches the
# provider the Kubemoot quickstart creates (ollama-local). Give the judge the
# strongest reasoning model you run: scores from a small judge are noisy. The
# maintainer's reference cluster judges with qwen3:32b.
models:
  - name: qwen3-8b
    model: "qwen3:8b"
    providerRef: ollama-local
    family: qwen3
    params: "8B"
    contextWindow: "32768"
    latencyClass: high
    vramMib: 5120
    capabilities: [reasoning]

# No MCP server or gateway: the judge calls no tools. The operator assembles the
# comparison document and hands it to the judge in the dispatch message.

crew:
  name: kubemoot-fitness
  description: Internal Kubemoot crew that scores fitness results against ground truth (REFLECTS judge)
  # The DEFER fitness keyword this crew evaluates. A scenario assertion
  # `DEFER synthesis REFLECTS "<ref>"` is resolved to this crew via the
  # kubemoot.ai/adl-keyword label. Change this (and the judge prompt) to serve a
  # different keyword.
  adlKeyword: REFLECTS
  discussion:
    enabled: true

# Namespaces whose pods may reach this crew's discussion gateway when the operator
# generates network policies (Crew spec.network.allowedIngress). Each entry is a
# Kubernetes namespace label selector. Empty: only the crew's own namespace and the
# operator. Needs a Kubemoot operator that supports Crew network policies; leave it
# empty on an operator that does not.
network:
  allowedIngress: []

# The crew ships no Model objects: the judge selects from the cluster's model
# catalog, requiring capability/reasoning and leaning to the largest model.
scheduling:
  # Extra labels every phase requires, added to capability/reasoning. Leave it
  # empty unless the catalog has more than one large reasoning model: then label
  # the one that should judge (a label on its Model in the operator namespace,
  # for example kubemoot.ai/fitness-judge: "true") and name the label here, so
  # every run is judged by that one model.
  requireLabels: {}

# No MCP server or gateway: the judge calls no tools. The operator assembles the
# comparison document and hands it to the judge in the dispatch message.

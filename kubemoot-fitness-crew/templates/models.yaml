{{/*
Model CRs for the fitness crew. Labeled with capability/family/params so the
CrewSchedulingPolicy can select per phase. serverRef points at ModelServer
CRs in the kubemoot namespace (cluster-shared).
*/}}
{{- range .Values.models }}
---
apiVersion: kubemoot.ai/v1alpha1
kind: Model
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kubemoot-fitness-crew.labels" $ | nindent 4 }}
    family: {{ .family | quote }}
    params: {{ .params | quote }}
    contextWindow: {{ .contextWindow | default "8192" | quote }}
    latencyClass: {{ .latencyClass | default "high" | quote }}
    {{- range $cap := .capabilities }}
    capability/{{ $cap }}: "true"
    {{- end }}
spec:
  model: {{ .model | quote }}
  serverRef: {{ required "each models entry needs serverRef: the ModelServer that serves it" .serverRef | quote }}
  {{- if .vramMib }}
  vramMib: {{ .vramMib }}
  {{- end }}
{{- end }}
